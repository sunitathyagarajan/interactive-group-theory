<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Group Theory</title>
<meta name="description" content="Interactive lessons on molecular symmetry and group theory.">
<meta name="color-scheme" content="light dark">
<style>
:root{
  --bg:#edf0f4; --surface:#ffffff; --ink:#16202b; --muted:#5a6775; --line:#d5dce5; --accent:#1f56c9;
  --bond:#8e9cac; --h-edge:#aab5c1;
  --display:"Segoe UI", Calibri, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --body:"Segoe UI", Calibri, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono:Consolas, "Cascadia Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --surface:#151c24; --ink:#e2e8ef; --muted:#93a1b0; --line:#28333f; --accent:#7aa2ff;
    --bond:#6f7e8e; --h-edge:#151c24;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#151c24; --ink:#e2e8ef; --muted:#93a1b0; --line:#28333f; --accent:#7aa2ff;
  --bond:#6f7e8e; --h-edge:#151c24;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:56px 16px}
.kicker{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:600 clamp(30px,5vw,42px)/1.1 var(--display);margin:10px 0 12px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 36px}
.lessons{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lessons a{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.lessons a:hover,.lessons a:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.lessons a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lessons svg{display:block;width:100%;max-width:220px;height:auto}
.lessons h2{font:600 21px/1.2 var(--display);margin:0;text-align:center}
@media (prefers-reduced-motion: reduce){ .lessons a{transition:none} .lessons a:hover,.lessons a:focus-visible{transform:none} }
/* molecule drawings */
.bd{stroke:var(--bond);stroke-width:5;stroke-linecap:round}
.bd.thin{stroke-width:3.5}
.h{stroke:var(--h-edge);stroke-width:1}
</style>
</head>
<body>
<!-- shared shading for the atom spheres -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="gO" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ff9a90"/><stop offset="1" stop-color="#c13f36"/></radialGradient>
    <radialGradient id="gN" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#9ab8ff"/><stop offset="1" stop-color="#335ccc"/></radialGradient>
    <radialGradient id="gC" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#97a3b0"/><stop offset="1" stop-color="#3b4550"/></radialGradient>
    <radialGradient id="gH" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c3ccd6"/></radialGradient>
  </defs>
</svg>
<main>
  <div class="kicker">Group theory · Molecular symmetry</div>
  <h1>Interactive Group Theory</h1>
  <p class="lede">Hands-on lessons that pair 3D molecular models with the point-group calculations behind them. Each one ends by predicting which vibrations appear in the infrared and Raman spectra.</p>
  <ul class="lessons">
    <li>
      <a href="water-vibrations.html">
        <svg viewBox="0 0 160 120" aria-hidden="true">
          <line class="bd" x1="80" y1="48" x2="40.5" y2="78.6"/><line class="bd" x1="80" y1="48" x2="119.5" y2="78.6"/>
          <circle cx="80" cy="48" r="21" fill="url(#gO)"/>
          <circle class="h" cx="40.5" cy="78.6" r="13" fill="url(#gH)"/><circle class="h" cx="119.5" cy="78.6" r="13" fill="url(#gH)"/>
        </svg>
        <h2>Water</h2>
      </a>
    </li>
    <li>
      <a href="ammonia-vibrations.html">
        <svg viewBox="0 0 160 120" aria-hidden="true">
          <line class="bd" x1="80" y1="40" x2="108" y2="70"/>
          <circle class="h" cx="108" cy="70" r="11" fill="url(#gH)"/>
          <line class="bd" x1="80" y1="40" x2="44" y2="80"/><line class="bd" x1="80" y1="40" x2="92" y2="98"/>
          <circle cx="80" cy="40" r="20" fill="url(#gN)"/>
          <circle class="h" cx="44" cy="80" r="13" fill="url(#gH)"/><circle class="h" cx="92" cy="98" r="13" fill="url(#gH)"/>
        </svg>
        <h2>Ammonia</h2>
      </a>
    </li>
    <li>
      <a href="co2-vibrations.html">
        <svg viewBox="0 0 160 120" aria-hidden="true">
          <line class="bd thin" x1="30" y1="54" x2="130" y2="54"/><line class="bd thin" x1="30" y1="66" x2="130" y2="66"/>
          <circle cx="80" cy="60" r="16" fill="url(#gC)"/>
          <circle cx="30" cy="60" r="20" fill="url(#gO)"/><circle cx="130" cy="60" r="20" fill="url(#gO)"/>
        </svg>
        <h2>Carbon dioxide</h2>
      </a>
    </li>
    <li>
      <a href="benzene-vibrations.html">
        <svg viewBox="0 0 160 120" aria-hidden="true">
          <g class="bd thin">
            <line x1="110" y1="60" x2="132" y2="60"/><line x1="95" y1="86" x2="106" y2="105"/><line x1="65" y1="86" x2="54" y2="105"/>
            <line x1="50" y1="60" x2="28" y2="60"/><line x1="65" y1="34" x2="54" y2="15"/><line x1="95" y1="34" x2="106" y2="15"/>
          </g>
          <polygon points="110,60 95,86 65,86 50,60 65,34 95,34" fill="none" class="bd thin" stroke-linejoin="round"/>
          <!-- Kekulé double bonds -->
          <g class="bd thin"><line x1="101.7" y1="63.8" x2="94.1" y2="76.9"/><line x1="65.9" y1="76.9" x2="58.3" y2="63.8"/><line x1="72.5" y1="39.3" x2="87.5" y2="39.3"/></g>
          <g fill="url(#gC)"><circle cx="110" cy="60" r="9"/><circle cx="95" cy="86" r="9"/><circle cx="65" cy="86" r="9"/><circle cx="50" cy="60" r="9"/><circle cx="65" cy="34" r="9"/><circle cx="95" cy="34" r="9"/></g>
          <g class="h" fill="url(#gH)"><circle cx="132" cy="60" r="7"/><circle cx="106" cy="105" r="7"/><circle cx="54" cy="105" r="7"/><circle cx="28" cy="60" r="7"/><circle cx="54" cy="15" r="7"/><circle cx="106" cy="15" r="7"/></g>
        </svg>
        <h2>Benzene</h2>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
