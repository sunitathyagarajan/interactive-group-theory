<title>Benzene Vibrations in D₆ₕ</title>

<meta name="color-scheme" content="light dark">
<style>
/* Layout: a sticky 3D "lab bench" on the left, the worked lesson on the right; on phones the bench pins to the top */
:root{
  --bg:#edf0f4; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#16202b; --muted:#5a6775; --line:#d5dce5;
  --accent:#1f56c9; --accent-soft:#e2eafb; --accent-ink:#ffffff;
  --good:#1d7548; --good-soft:#dff2e7; --bad:#b4372e; --bad-soft:#fbe5e2;
  --a1:#1d7548; --a2:#7647b5; --b:#1a7aa1; --e:#b8640f;
  --stage:#0c141d; --stage-2:#142131; --stage-ink:#dbe5ee; --stage-muted:#8a9bab; --stage-line:#26384c;
  --x:#f2a23a; --y:#45d0a0; --z:#93a6ff; --mode:#ffd35c;
  --display:"Segoe UI", Calibri, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --body:"Segoe UI", Calibri, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono:Consolas, "Cascadia Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --surface:#151c24; --surface-2:#1a232d; --ink:#e2e8ef; --muted:#93a1b0; --line:#28333f;
    --accent:#7aa2ff; --accent-soft:#1d2a45; --accent-ink:#0b1220;
    --good:#5fd09a; --good-soft:#143326; --bad:#ff8a7f; --bad-soft:#3a1c1a;
    --a1:#5fd09a; --a2:#b993f0; --b:#5cc2ea; --e:#f0a85a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#151c24; --surface-2:#1a232d; --ink:#e2e8ef; --muted:#93a1b0; --line:#28333f;
  --accent:#7aa2ff; --accent-soft:#1d2a45; --accent-ink:#0b1220;
  --good:#5fd09a; --good-soft:#143326; --bad:#ff8a7f; --bad-soft:#3a1c1a;
  --a1:#5fd09a; --a2:#b993f0; --b:#5cc2ea; --e:#f0a85a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
sub,sup{font-size:.72em;line-height:0}

.app{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);grid-template-areas:"stage head" "stage lesson";grid-template-rows:auto 1fr;column-gap:32px;padding-inline:16px;padding-block:16px;max-width:1520px;margin:0 auto}

/* ---------- header ---------- */
.head{grid-area:head;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding-block:6px 18px;border-bottom:1px solid var(--line)}
.brand .kicker{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{font:600 clamp(26px,3vw,34px)/1.1 var(--display);margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.back{font:500 13px var(--body);color:var(--accent);text-decoration:none;padding-bottom:4px}
.back:hover{text-decoration:underline}

/* ---------- stage ---------- */
.stage{grid-area:stage;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:480px;max-height:980px;border-radius:14px;overflow:hidden;background:var(--stage);color:var(--stage-ink);isolation:isolate}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;font:500 13px/1 var(--mono);color:var(--stage-ink);text-shadow:0 1px 3px #000c;white-space:nowrap;will-change:transform}
.lab.axis{font-style:italic;font-size:14px}
.lab.atom{font:600 14px/1 var(--body)}
.lab.elem{font:500 12px/1 var(--mono);color:#ffe28a;background:#0c141dcc;padding:3px 6px;border-radius:4px}
.lab.elem.sv1{color:#9cc3ff}.lab.elem.sv2{color:#e0b3ff}.lab.elem.sv3{color:#ffb3cb}
.st-top{position:absolute;inset:12px 12px auto 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.st-top>*{pointer-events:auto}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--stage-line);background:#0c141dcc;color:var(--stage-muted);border-radius:999px;padding:4px 11px;font:500 12px var(--body);cursor:pointer}
.tg[aria-pressed="true"]{color:var(--stage-ink);border-color:#4b6380;background:var(--stage-2)}
.showing{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:#0c141dd9;border:1px solid var(--stage-line);border-radius:10px;padding:6px 10px;font-size:12.5px}
.showing:empty{display:none}
.legend{display:flex;gap:10px;font:500 12px var(--mono)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.mini{border:1px solid var(--stage-line);background:var(--stage-2);color:var(--stage-ink);border-radius:6px;padding:2px 8px;font:500 12px var(--body);cursor:pointer}
.mini[aria-pressed="true"]{background:#ffd35c;color:#1a1400;border-color:#ffd35c}
.partners{display:inline-flex;gap:4px}
.st-bottom{position:absolute;inset:auto 12px 12px 12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.caption{align-self:flex-start;max-width:min(100%,560px);background:#0c141de6;border:1px solid var(--stage-line);border-radius:10px;padding:8px 12px;font-size:13.5px;line-height:1.45;pointer-events:auto}
.caption b{color:#fff}
.opbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;pointer-events:auto;background:#0c141de6;border:1px solid var(--stage-line);border-radius:12px;padding:6px}

.sop{border:1px solid #33506e;background:var(--stage-2);color:var(--stage-ink);border-radius:8px;padding:6px 12px;font:500 14px var(--body);cursor:pointer;min-width:52px}

.sop.active{background:#ffd35c;color:#1a1400;border-color:#ffd35c}

.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--stage-muted)}

.lesson{grid-area:lesson;min-width:0;padding-block:18px 48px;scroll-margin-top:16px}
.stepper{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;list-style:none;padding:0}

.body{max-width:66ch}
.eyebrow{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.body h2{font:600 26px/1.2 var(--display);margin:0 0 12px;text-wrap:balance}

.body p{margin:0 0 12px}

.hint{color:var(--muted);font-size:14px;font-style:italic}
.callout{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:14.5px}

.formula{font:500 17px/1.6 var(--display);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0;text-align:center;overflow-x:auto}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 3px}

.dof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:14px 0 8px}
.dof .s{border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}

.opcard header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.opsym{font:600 20px/1 var(--display)}
.opname{font-size:13px;color:var(--muted)}
.opcard p{font-size:14px;margin:0}
.um{font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px;margin-top:auto}
.um .lbl{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.um b{font:600 16px var(--mono);color:var(--good)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:500;align-self:flex-start}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btnrow.tight{margin:2px 0 0;gap:6px}

.tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child>th,tr:last-child>td{border-bottom:0}
thead th{font:500 13px var(--body);color:var(--muted);background:var(--surface-2)}
tbody th{text-align:left;font-weight:500}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.fn{font-family:var(--body);font-style:italic;color:var(--muted);text-align:left}
td.fn mark{background:none;color:var(--ink);font-weight:600}
td.fn mark.tr{box-shadow:inset 0 -2px 0 var(--e)}
td.fn mark.ro{box-shadow:inset 0 -2px 0 var(--a2)}
td.fn mark.qd{box-shadow:inset 0 -2px 0 var(--accent)}
tr.total th,tr.total td{background:var(--accent-soft);font-weight:600}
tr.sub td,tr.sub th{color:var(--muted)}
td.p1{color:var(--good);font-weight:600}
td.m1{color:var(--bad);font-weight:600}
td.z{color:var(--muted)}
td.q{color:var(--muted)}
.cell-in{width:58px;padding:5px 6px;text-align:center;font:500 14px var(--mono);border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink)}
.cell-in.ok{border-color:var(--good);background:var(--good-soft)}
.cell-in.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-size:14px;margin:6px 0 12px}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}

.chip{display:inline-flex;align-items:center;gap:5px;font:600 13.5px var(--body);color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:6px;padding:1px 7px;white-space:nowrap}
.chip.a1{--c:var(--a1)}.chip.a2{--c:var(--a2)}.chip.e{--c:var(--e)}
.rep{font:600 18px var(--display)}
.result{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.result .lhs{font:600 18px var(--display)}

.matrices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.mat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mat .t{font:600 15px var(--display)}
.mat .grid{display:grid;grid-template-columns:repeat(3,44px);gap:2px 2px;font:500 13px var(--mono);text-align:center;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);padding:2px 4px;border-radius:3px}
.mat .grid span.d{color:var(--accent);font-weight:600}
.mat .tr{font:500 12px var(--mono);color:var(--muted)}

.work{font:14px/1.9 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;overflow-x:auto;white-space:nowrap}

.motions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.motion{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.motion:hover{border-color:var(--accent)}
.motion.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.motion .nm{font:600 15px var(--display)}
.motion .ir{font-size:13px;color:var(--muted)}

.modes{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.mode.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mode h4{margin:0;font:600 17px var(--display)}
.mode .wn{font:500 13px var(--mono);color:var(--muted)}
.mode p{grid-column:1/-1;margin:0;font-size:14px}
.mode .chars{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cbox{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:13px;background:var(--surface-2)}
.cbox b{font:600 13px var(--mono)}
.cbox b.p1{color:var(--good)}.cbox b.m1{color:var(--bad)}.cbox b.q{color:var(--muted)}

.yn{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;vertical-align:middle}
.yn button{border:0;background:var(--surface);padding:3px 10px;font:500 13px var(--body);cursor:pointer;color:var(--muted)}
.yn button+button{border-left:1px solid var(--line)}
.yn button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.yn.ok{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.yn.no{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.rd{font:500 12px var(--mono);color:var(--stage-muted)}
.rd b{color:var(--stage-ink)}.rd b.on{color:#ff8fc0}.rd b.on2{color:#8fdcff}
.spec{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 6px;margin:12px 0}
.spec svg{display:block;width:100%;height:auto;overflow:visible}
.spec .base{stroke:var(--line);stroke-width:1}
.spec .ax{font:500 11px var(--mono);fill:var(--muted)}
.spec .pl{font:600 13px var(--body);fill:var(--ink)}
.spec .lb{font:500 10.5px var(--mono);fill:var(--muted)}

.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font:500 12px var(--body);padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));display:none;z-index:2}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "lesson";grid-template-rows:auto auto auto;row-gap:12px}

  .stage{top:env(safe-area-inset-top,0px);height:48dvh;min-height:320px;z-index:5;border-radius:12px}
  .lesson{scroll-margin-top:calc(48dvh + 16px);padding-top:6px}
  .lab.elem{display:none}

}
@media (max-width:560px){
  .cards,.matrices{grid-template-columns:repeat(2,minmax(0,1fr))}

@media (max-width:400px){ .cards{grid-template-columns:minmax(0,1fr)} }
.chip.b{--c:var(--b)}
.lab.elem.sh{color:#9cc3ff}.lab.elem.sv{color:#e0b3ff}.lab.elem.sd{color:#ffb3cb}.lab.elem.c2p{color:#ffc58f}.lab.elem.c2pp{color:#c4ffb6}

<script>
(function(){
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const fmt = n => { n = Math.round(n*1000)/1000; if (n === 0) n = 0; return n < 0 ? '−' + (-n) : String(n); };
const fmtS = n => n > 0 ? '+' + n : fmt(n);
const parseNum = s => { if (s == null) return NaN; s = String(s).trim().replace(/[−–]/g,'-'); return s === '' ? NaN : Number(s); };
const R3 = Math.sqrt(3)/2;
const snap = v => Math.abs(v - Math.round(v)) < 1e-6 ? Math.round(v) : v;

/* ---------- molecular model (display units, centre of mass at origin) ---------- */
const SCALE = 0.95;
let ATOMS = [], FIELDS = {}, SPECIES = [], MODES = [];
function mul(M,v){ return V(M[0][0]*v.x+M[0][1]*v.y+M[0][2]*v.z, M[1][0]*v.x+M[1][1]*v.y+M[1][2]*v.z, M[2][0]*v.x+M[2][1]*v.y+M[2][2]*v.z); }

// starting motions for the projection operators, each on a single atom (C1 is atom 0, H1 is atom 6, both on the +x axis)
const SEEDS = [
  {name:'C–H stretch',           atom:6, d:[1,0,0]},
  {name:'ring stretch',          atom:0, d:[1,0,0]},
  {name:'C–H in-plane bend',     atom:6, d:[0,1,0]},
  {name:'ring deformation',      atom:0, d:[0,1,0]},
  {name:'C–H out-of-plane bend', atom:6, d:[0,0,1]},
  {name:'ring pucker',           atom:0, d:[0,0,1]},

// displacement patterns are arrays of one vector per atom
const zeroQ = () => ATOMS.map(() => V(0,0,0));
const dotQ = (A,B) => A.reduce((s,a,i)=> s + a.dot(B[i]), 0);
const addQ = (A,B,k=1) => A.map((a,i)=> a.clone().addScaledVector(B[i], k));

function actQ(op, Q){ const p = perm(op), out = []; Q.forEach((d,i) => out[p[i]] = mul(op.M, d)); return out; }

const projectQ = (ir, Q) => OPS.reduce((s,op) => addQ(s, actQ(op,Q), ir.chi[classIdx(op.cls)]), zeroQ());

function buildModel(){
  // r(C–C) = 1.397 Å, r(C–H) = 1.084 Å
  const rC = 1.397, rH = rC + 1.084;
  ATOMS = [];
  for (let k=0;k<6;k++){ const [c,s] = dir(60*k); ATOMS.push({key:'C'+(k+1), html:`C<sub>${k+1}</sub>`, el:'C', pos:V(rC*c, rC*s, 0).multiplyScalar(SCALE)}); }
  for (let k=0;k<6;k++){ const [c,s] = dir(60*k); ATOMS.push({key:'H'+(k+1), html:`H<sub>${k+1}</sub>`, el:'H', pos:V(rH*c, rH*s, 0).multiplyScalar(SCALE)}); }

  const norm = vecs => { const m = Math.max(...vecs.map(v=>v.length())); return vecs.map(v=>v.clone().multiplyScalar(0.75/m)); };
  const rot = ax => norm(ATOMS.map(at => ax.clone().cross(at.pos)));
  const tr = ax => ATOMS.map(() => ax.clone().multiplyScalar(0.7));
  // degenerate (E) motions carry two partner patterns in `parts`; everything else has a single `vecs`
  FIELDS = {
    Tz:{kind:'trans', html:'T<sub><i>z</i></sub>', name:'Translation along <i>z</i>', vecs:tr(V(0,0,1))},
    Txy:{kind:'trans', html:'(T<sub><i>x</i></sub>, T<sub><i>y</i></sub>)', name:'Translation along <i>x</i> or <i>y</i>',
         parts:[tr(V(1,0,0)), tr(V(0,1,0))], partHTML:['T<sub><i>x</i></sub>','T<sub><i>y</i></sub>']},
    Rz:{kind:'rot', html:'R<sub><i>z</i></sub>', name:'Rotation about <i>z</i>', vecs:rot(V(0,0,1))},
    Rxy:{kind:'rot', html:'(R<sub><i>x</i></sub>, R<sub><i>y</i></sub>)', name:'Rotation about <i>x</i> or <i>y</i>',
         parts:[rot(V(1,0,0)), rot(V(0,1,0))], partHTML:['R<sub><i>x</i></sub>','R<sub><i>y</i></sub>']},
  };

  // Mass-weighted, so every pattern keeps the centre of mass fixed (Σ m v = 0) and carries no angular momentum (Σ m r × v = 0).

        ...(two ? {parts:[norm(f.a), norm(f.b)], partHTML:['partner a','partner b']} : {vecs:norm(f.a)})};

const fieldVecs = F => F.parts ? F.parts[S.part] : F.vecs;

let PERM = new Map();
function perm(op){
  if (!PERM.has(op)) PERM.set(op, ATOMS.map(at => { const w = mul(op.M, at.pos); return ATOMS.findIndex(b => b.pos.distanceTo(w) < 1e-3); }));
  return PERM.get(op);
}
function unmoved(op){ return perm(op).map((j,i)=> j===i ? i : -1).filter(i=>i>=0); }
const gamma3N = () => CLASSES.map(c => unmoved(c.rep).length * snap(trace(c.rep.M)));
// How the partner patterns Q_k of a motion mix under op: R·Q_k = Σ_l D[l][k] Q_l, so D = G⁻¹B with G = ⟨Q_l,Q_k⟩ and B = ⟨Q_l,R·Q_k⟩
function fieldMatrix(op, F){
  const Q = F.parts || [F.vecs];
  const RQ = Q.map(q => actQ(op, q));
  const G = Q.map(a => Q.map(c => dotQ(a,c))), B = Q.map(a => RQ.map(rq => dotQ(a,rq)));
  if (Q.length === 1) return [[B[0][0]/G[0][0]]];
  const det = G[0][0]*G[1][1] - G[0][1]*G[1][0], Gi = [[G[1][1]/det, -G[0][1]/det], [-G[1][0]/det, G[0][0]/det]];
  return Gi.map(row => [0,1].map(k => row[0]*B[0][k] + row[1]*B[1][k]));
}
const fieldDiag = (op, F) => fieldMatrix(op, F).map((row,k) => snap(row[k]));
const fieldChar = (op, F) => Math.round(fieldDiag(op, F).reduce((a,c)=> a + c, 0));
const fieldChars = id => CLASSES.map(c => fieldChar(c.rep, FIELDS[id]));
const sumChars = ids => CLASSES.map((c,k) => ids.reduce((s,id)=> s + fieldChars(id)[k], 0));
const reduce = ch => IRREPS.map(ir => ch.reduce((s,x,k)=> s + CLASSES[k].g*x*ir.chi[k], 0)/ORDER);
const irrepOf = ch => IRREPS.find(ir => ir.chi.every((c,k)=> c === ch[k]));
const repHTML = ns => ns.map((n,k)=> n ? `${n>1?n:''}${IRREPS[k].html}` : '').filter(Boolean).join(' + ') || '0';
const vibIrreps = () => reduce(gamma3N().map((x,k)=> x - sumChars(['Tz','Txy'])[k] - sumChars(['Rz','Rxy'])[k]));
function cartCells(op){
  const p = perm(op), E3 = [V(1,0,0),V(0,1,0),V(0,0,1)];
  return ATOMS.map((at,i) => E3.map(e => p[i] === i ? snap(mul(op.M,e).dot(e)) : null));
}

/* ---------- how a vibration couples to light (steps 8 and 9) ---------- */
// toy models, symmetric by construction: point charges for the dipole, bond-additive polarizability
const CHARGE = [...Array(6).fill(-0.12), ...Array(6).fill(0.12)];
const BONDS = [...[0,1,2,3,4,5].map(k => [k, (k+1)%6]), ...[0,1,2,3,4,5].map(k => [k, k+6])];
function polar(P){
  const A = [[0,0,0],[0,0,0],[0,0,0]];
  BONDS.forEach(([i,j]) => {
    const d = P[j].clone().sub(P[i]), L = d.length(), u = [d.x/L, d.y/L, d.z/L], par = L*L, perp = .3*L*L;   // each bond is easier to polarize along its length
    for (let a=0;a<3;a++) for (let c=0;c<3;c++) A[a][c] += (par - perp)*u[a]*u[c] + (a === c ? perp : 0);
  });
  return A;
}
let RESP = {};
function response(id, part){
  const k = id + ':' + part; if (RESP[k]) return RESP[k];
  const F = FIELDS[id], vecs = F.parts ? F.parts[part] : F.vecs, P = ATOMS.map(at => at.pos), eps = 1e-4;
  const dmu = vecs.reduce((s,v,i)=> s.addScaledVector(v, CHARGE[i]), V(0,0,0));
  const Ap = polar(P.map((p,i)=> p.clone().addScaledVector(vecs[i], eps))), Am = polar(P.map((p,i)=> p.clone().addScaledVector(vecs[i], -eps)));
  const dA = Ap.map((row,a)=> row.map((x,c)=> (x - Am[a][c])/(2*eps))), A0 = polar(P);
  const n0 = Math.hypot(...A0.flat()), nd = Math.hypot(...dA.flat());
  return RESP[k] = {dmu, ir:dmu.length() > 1e-6, A0, dA, n0, nd, raman:nd > 1e-5*n0};
}
const irActive = ir => ir.lin.length > 0, ramanActive = ir => ir.quad !== '';

const GEO = {shaft:new THREE.CylinderGeometry(1,1,1,14), head:new THREE.ConeGeometry(1,1,20), sphere:new THREE.SphereGeometry(1,40,28), bond:new THREE.CylinderGeometry(1,1,1,20)};
const UP = V(0,1,0);
function makeArrow(color, o={}){
  const op = o.opacity ?? 1;
  const mat = new THREE.MeshStandardMaterial({color, roughness:.45, metalness:.05, transparent:op<1, opacity:op, depthWrite:op>=1});
  const g = new THREE.Group(), shaft = new THREE.Mesh(GEO.shaft, mat), head = new THREE.Mesh(GEO.head, mat);
  g.add(shaft, head);
  g.userData = {shaft, head, mat, r:o.r ?? .035, hr:o.hr ?? .09, hl:o.hl ?? .2};
  return g;
}
function placeArrow(g, from, vec){
  const L = vec.length(); if (L < 1e-3){ g.visible = false; return; }
  g.visible = true;
  const {shaft, head, r, hr} = g.userData, hl = Math.min(g.userData.hl, L*.5);
  g.position.copy(from);
  g.quaternion.setFromUnitVectors(UP, vec.clone().divideScalar(L));
  shaft.scale.set(r, L-hl, r); shaft.position.set(0, (L-hl)/2, 0);
  head.scale.set(hr, hl, hr);  head.position.set(0, L-hl/2, 0);
}

// axes

  const a = makeArrow(c, {opacity:.8, r:.012, hr:.05, hl:.16}); placeArrow(a, d.clone().multiplyScalar(-AX), d.clone().multiplyScalar(2*AX + .2)); axesGroup.add(a);
});

// symmetry elements: one entry per axis, plane or centre, switched on together or lit up by the operation in progress
const ELEM = {};
function axisElem(id, d, len, color){
  const v = V(...d);
  const mat = new THREE.LineDashedMaterial({color, dashSize:.14, gapSize:.09, transparent:true, opacity:.8});
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([v.clone().multiplyScalar(-len), v.clone().multiplyScalar(len)]), mat); line.computeLineDistances();
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,2*len,10), new THREE.MeshBasicMaterial({color, transparent:true, opacity:0, depthWrite:false}));
  tube.quaternion.setFromUnitVectors(UP, v);
  const grp = new THREE.Group(); grp.add(line, tube); scene.add(grp);
  ELEM[id] = {set(on, hot){ grp.visible = on; tube.material.opacity = hot ? .55 : 0; mat.opacity = hot ? 1 : .4; }};
}
function planeElem(id, geo, color, quiet){
  const fill = new THREE.MeshBasicMaterial({color, transparent:true, opacity:quiet, side:THREE.DoubleSide, depthWrite:false});
  const edge = new THREE.LineBasicMaterial({color, transparent:true, opacity:.4});
  const grp = new THREE.Group(); grp.add(new THREE.Mesh(geo, fill), new THREE.LineSegments(new THREE.EdgesGeometry(geo), edge)); scene.add(grp);
  ELEM[id] = {set(on, hot){ grp.visible = on; fill.opacity = hot ? .26 : quiet; edge.opacity = hot ? .95 : quiet*5; }};
}
axisElem('Cz', Z, 2.8, COL.cz);
[0,1,2].forEach(k => { axisElem('C2p'+(k+1), dir(60*k), 3.4, COL.c2p); axisElem('C2pp'+(k+1), dir(30+60*k), 3.4, COL.c2pp); });
planeElem('sh', new THREE.CircleGeometry(3.2, 64), COL.sh, .06);
[0,1,2].forEach(k => {
  const vert = az => { const g = new THREE.PlaneGeometry(6.8, 3.0); g.rotateX(Math.PI/2); g.rotateZ(rad(az)); return g; };
  planeElem('sv'+(k+1), vert(60*k), COL.sv, .04);
  planeElem('sd'+(k+1), vert(30+60*k), COL.sd, .04);
});
(function(){
  const m = new THREE.Mesh(new THREE.SphereGeometry(.11, 20, 14), new THREE.MeshBasicMaterial({color:COL.cz}));

// placement and style of each element's label
const ELEM_LABELS = {Cz:['<i>C</i><sub>6</sub>', V(0,0,3.0), 'elem'], sh:['σ<sub>h</sub>', V(2.4,-2.4,0), 'elem sh'], inv:['<i>i</i>', V(0,0,0), 'elem']};
[0,1,2].forEach(k => {
  const at = (az, r, h) => { const [c,s] = dir(az); return V(r*c, r*s, h); };
  ELEM_LABELS['C2p'+(k+1)] = ['<i>C</i><sub>2</sub>′', at(60*k, 3.6, 0), 'elem c2p'];
  ELEM_LABELS['C2pp'+(k+1)] = ['<i>C</i><sub>2</sub>″', at(30+60*k, 3.6, 0), 'elem c2pp'];
  ELEM_LABELS['sv'+(k+1)] = ['σ<sub>v</sub>', at(60*k, 3.3, 1.4), 'elem sv'];

});

// molecule: "live" copy is transformed by the operation, "ghost" stays at the starting position
const live = new THREE.Group(); live.matrixAutoUpdate = false; scene.add(live);
const ghost = new THREE.Group(); scene.add(ghost);
const atomMeshes = [], ghostMeshes = [], bonds = [];
[...Array(6).fill('C'), ...Array(6).fill('H')].forEach(el => {
  const m = new THREE.Mesh(GEO.sphere, new THREE.MeshStandardMaterial({color:COL[el], roughness:.32, metalness:0}));
  m.scale.setScalar(el==='C' ? .28 : .19); live.add(m); atomMeshes.push(m);
  const g = new THREE.Mesh(GEO.sphere, new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.12, depthWrite:false}));
  g.scale.setScalar(el==='C' ? .42 : .32); ghost.add(g); ghostMeshes.push(g);
});
BONDS.forEach(() => { const b = new THREE.Mesh(GEO.bond, new THREE.MeshStandardMaterial({color:COL.bond, roughness:.5})); live.add(b); bonds.push(b); });
const livePool = [], ghostPool = [];
function poolArrow(pool, parent, k, ghostly){
  while (pool.length <= k){ const a = makeArrow(0xffffff, ghostly ? {opacity:.28} : {}); parent.add(a); pool.push(a); }
  return pool[k];
}
function placeBond(mesh, a, b){
  const d = b.clone().sub(a), L = d.length();
  mesh.position.copy(a).addScaledVector(d, .5);
  mesh.quaternion.setFromUnitVectors(UP, d.divideScalar(L));
  mesh.scale.set(.065, L, .065);
}

// step 8 and 9 overlays: the oscillating dipole change (IR) and the polarizability ellipsoid (Raman)
const dipArrow = makeArrow(0xff5fa2, {r:.05, hr:.13, hl:.3}); dipArrow.visible = false; scene.add(dipArrow);
const ellip = new THREE.Group(); ellip.matrixAutoUpdate = false; ellip.visible = false; scene.add(ellip);
ellip.add(new THREE.Mesh(GEO.sphere, new THREE.MeshStandardMaterial({color:0x7fd6ff, transparent:true, opacity:.12, depthWrite:false, side:THREE.DoubleSide})));
ellip.add(new THREE.Mesh(new THREE.SphereGeometry(1,20,12), new THREE.MeshBasicMaterial({color:0x7fd6ff, wireframe:true, transparent:true, opacity:.2, depthWrite:false})));

function arrowSpecs(){
  if (S.arrows === 'cart'){
    const out = [];
    ATOMS.forEach((at,i) => [[V(1,0,0),COL.x],[V(0,1,0),COL.y],[V(0,0,1),COL.z]].forEach(([d,c]) => out.push({atom:i, vec:d.multiplyScalar(.55), color:c})));
    return out;
  }
  if (S.arrows === 'field' && FIELDS[S.fieldId]) return fieldVecs(FIELDS[S.fieldId]).map((v,i)=>({atom:i, vec:v, color:COL.mode})).filter(s => s.vec.length() > .04);
  return [];
}

// operation animation
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
function exactMatrix(op){ const M = op.M, m = new THREE.Matrix4(); m.set(M[0][0],M[0][1],M[0][2],0, M[1][0],M[1][1],M[1][2],0, M[2][0],M[2][1],M[2][2],0, 0,0,0,1); return m; }
// a reflection animated as a squash through the mirror plane
function squash(normal, e){
  const m = new THREE.Matrix4();
  let s = 1 - 2*e; if (Math.abs(s) < .02) s = s < 0 ? -.02 : .02;
  const [x,y,z] = normal, k = s - 1;
  m.set(1+k*x*x, k*x*y, k*x*z, 0,  k*y*x, 1+k*y*y, k*y*z, 0,  k*z*x, k*z*y, 1+k*z*z, 0,  0,0,0,1);
  return m;
}
function opMatrix(op, e){
  const m = new THREE.Matrix4();
  if (op.kind === 'rot') m.makeRotationAxis(V(...op.axis), op.angle*e);
  else if (op.kind === 'refl') return squash(op.normal, e);
  else if (op.kind === 'imp'){   // improper rotations (and i) play as a rotation about z, then the σh reflection
    m.makeRotationAxis(V(0,0,1), op.angle*Math.min(1, 2*e));
    if (e > .5) m.premultiply(squash(Z, 2*e - 1));
  }
  return m;
}
function computeResult(op){
  const r = {op, unmoved:unmoved(op), kind:S.arrows};
  if (S.arrows === 'cart'){ r.cells = cartCells(op); r.chi = snap(r.cells.flat().reduce((s,c)=> s + (c||0), 0)); }
  if (S.arrows === 'field') { r.diag = fieldDiag(op, FIELDS[S.fieldId]); r.chi = fieldChar(op, FIELDS[S.fieldId]); r.fieldId = S.fieldId; }
  return r;
}
function applyOp(id){
  const op = OPS.find(o => o.id === id);
  S.hold = null;
  S.anim = {op, t0:performance.now(), dur: reduced ? 1 : ({E:800, imp:2200}[op.kind] || 1600), result:computeResult(op)};
  setCaption(`Applying ${op.html}…`);
  markOpButtons(id);
}
function finishOp(){
  const r = S.anim.result; S.hold = {op:r.op, result:r}; S.anim = null;
  S.seenOps[r.op.id] = true;
  if (r.kind === 'cart'){ S.cart[r.op.id] = r; S.cartLast = r.op.id; }
  if (r.kind === 'field' && FIELDS[r.fieldId].kind === 'vib'){ (S.modeTests[FIELDS[r.fieldId].species] ||= {})[r.op.cls] = r.chi; }
  ghostMeshes.forEach((g,i) => { const um = r.unmoved.includes(i); g.material.color.setHex(um ? COL.halo : 0xffffff); g.material.opacity = um ? .3 : .1; });
  setCaption(resultCaption(r));
  if ([1,2,6].includes(S.step)) renderLesson();
}
function resetOp(){
  S.anim = null; S.hold = null; markOpButtons(null);
  ghostMeshes.forEach(g => { g.material.color.setHex(0xffffff); g.material.opacity = .12; });
  setCaption(defaultCaption());
}
function moveText(op){
  const moved = perm(op).filter((j,i) => j !== i).length;
  if (!moved) return '';
  return moved === ATOMS.length ? ' Every atom has moved to another atom\'s place.' : ` The other ${moved} atoms have moved to each other's places.`;
}
function resultCaption(r){
  const names = r.unmoved.map(i => ATOMS[i].html).join(', ') || 'none';
  let s = `<b>${r.op.html}</b> done. Unmoved atoms (green halo): <b>${names}</b>.` + moveText(r.op);
  if (r.kind === 'cart') s += ` Faint arrows show where the vectors started. Sum of contributions on unmoved atoms: χ = <b>${fmt(r.chi)}</b>.`;
  if (r.kind === 'field'){
    const F = FIELDS[r.fieldId];
    if (!F.parts) s += r.chi > 0 ? ' The yellow pattern lands on itself: χ = <b>+1</b>.' : ' The yellow pattern is reversed: χ = <b>−1</b>.';
    else {
      const mixed = r.diag.some(d => !Number.isInteger(d));
      s += `${mixed ? ' The pattern has turned into a mix of the two partners.' : ''} How much of each partner survives: ${F.partHTML[0]} <b>${niceS(r.diag[0])}</b>, ${F.partHTML[1]} <b>${niceS(r.diag[1])}</b>. The pair's character is their sum: χ = <b>${fmt(r.chi)}</b>.`;
    }
  }
  return s;
}
function defaultCaption(){
  if (S.arrows === 'cart') return 'Thirty-six unit vectors: <i>x</i>, <i>y</i>, <i>z</i> on each atom. Apply an operation and watch where each one ends up.';
  if (S.arrows === 'field'){
    const F = FIELDS[S.fieldId];
    if (F.parts) return `Showing ${F.partHTML[S.part]} of the degenerate pair ${F.html}. Apply an operation and see how much of each partner survives.`;
    return `Showing ${F.kind === 'vib' ? F.html + ', ' + F.name : F.name.toLowerCase()}. Apply an operation: does the yellow pattern stay the same (+1) or reverse (−1)?`;
  }
  return 'Drag to rotate, scroll to zoom. Apply an operation to see what it does to the molecule.';
}
function setCaption(html){ $('caption').innerHTML = html; }
function markOpButtons(id){ document.querySelectorAll('.sop[data-op]').forEach(b => b.classList.toggle('active', b.dataset.op === id)); }

// camera orbit
const DEFAULT_CAM = {theta:-0.75, phi:0.95, r:9.2};   // oblique, so in-plane and out-of-plane motion both show
const cam = {...DEFAULT_CAM};
function placeCamera(){
  const {theta, phi, r} = cam;
  camera.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
  camera.lookAt(0,0,0);
}
const ptrs = new Map(); let pinch0 = null;
canvas.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); canvas.setPointerCapture(e.pointerId); pinch0 = null; });
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 2){
    p.x = e.clientX; p.y = e.clientY;
    const [a,b] = [...ptrs.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
    if (pinch0) cam.r = Math.min(16, Math.max(5, cam.r*pinch0/d));
    pinch0 = d; return;
  }
  cam.theta -= (e.clientX - p.x) * .008;
  cam.phi = Math.min(Math.PI-.12, Math.max(.12, cam.phi - (e.clientY - p.y) * .008));
  p.x = e.clientX; p.y = e.clientY;
});
['pointerup','pointercancel'].forEach(t => canvas.addEventListener(t, e => { ptrs.delete(e.pointerId); pinch0 = null; }));
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.r = Math.min(16, Math.max(5, cam.r * Math.exp(e.deltaY*.0015))); }, {passive:false});
canvas.addEventListener('keydown', e => {
  const k = {ArrowLeft:[.12,0], ArrowRight:[-.12,0], ArrowUp:[0,.1], ArrowDown:[0,-.1]}[e.key];
  if (!k) return; e.preventDefault();
  cam.theta += k[0]; cam.phi = Math.min(Math.PI-.12, Math.max(.12, cam.phi + k[1]));
});

// HTML labels projected from 3D
const labelEls = {};
function label(key, html, cls){
  if (!labelEls[key]){ const el = document.createElement('span'); el.className = 'lab ' + cls; labelEls[key] = el; labelsEl.appendChild(el); }
  const el = labelEls[key]; if (el._html !== html){ el.innerHTML = html; el._html = html; } return el;
}
const tmpV = V(0,0,0);
function putLabel(el, world, dx, dy, show){
  if (!show){ el.style.display = 'none'; return; }
  tmpV.copy(world).project(camera);
  if (tmpV.z > 1){ el.style.display = 'none'; return; }
  el.style.display = '';
  const w = canvas.clientWidth, h = canvas.clientHeight;
  el.style.transform = `translate(${(tmpV.x+1)/2*w + dx}px, ${(1-tmpV.y)/2*h + dy}px) translate(-50%,-50%)`;
}

function resize(){
  if (!renderer) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.fov = w/h < .9 ? 48 : 36;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);

let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last)/1000); last = now;
  let M = null, activeOp = null;
  if (S.anim){
    activeOp = S.anim.op;
    const t = Math.min(1, (now - S.anim.t0)/S.anim.dur);
    M = t >= 1 ? exactMatrix(activeOp) : opMatrix(activeOp, ease(t));
    if (t >= 1) finishOp();
  } else if (S.hold){ activeOp = S.hold.op; M = exactMatrix(activeOp); }
  live.matrix.copy(M || new THREE.Matrix4()); live.matrixWorldNeedsUpdate = true;
  ghost.visible = !!activeOp;

  const field = S.arrows === 'field' ? FIELDS[S.fieldId] : null, fv = field && fieldVecs(field);
  const osc = field && !activeOp;
  if (osc && S.playing) S.phase += dt * Math.PI * 2 * .55;
  const amp = osc ? .3 * Math.sin(S.phase) : 0;
  const cur = ATOMS.map((at,i) => field ? at.pos.clone().addScaledVector(fv[i], amp) : at.pos.clone());
  cur.forEach((p,i) => { atomMeshes[i].position.copy(p); ghostMeshes[i].position.copy(ATOMS[i].pos); });
  bonds.forEach((b,k) => placeBond(b, cur[BONDS[k][0]], cur[BONDS[k][1]]));

  const specs = arrowSpecs();
  specs.forEach((s,k) => {
    const a = poolArrow(livePool, live, k, false); a.userData.mat.color.setHex(s.color); placeArrow(a, cur[s.atom], s.vec);
    const g = poolArrow(ghostPool, ghost, k, true); g.userData.mat.color.setHex(s.color); placeArrow(g, ATOMS[s.atom].pos, s.vec);
  });
  for (let k = specs.length; k < livePool.length; k++){ livePool[k].visible = false; ghostPool[k].visible = false; }

  const spec = (S.step === SPEC_STEP || S.step === RA_STEP) && field && !activeOp;
  const resp = spec ? response(S.fieldId, S.part) : null;
  dipArrow.visible = !!(resp && resp.ir && S.step === SPEC_STEP); ellip.visible = !!(resp && S.step === RA_STEP);
  if (resp){
    const s = Math.sin(S.phase);   // in step with the atoms
    if (resp.ir && S.step === SPEC_STEP) placeArrow(dipArrow, V(0,0,0), resp.dmu.clone().normalize().multiplyScalar(1.6*s));
    const k = 6.6/(resp.A0[0][0] + resp.A0[1][1] + resp.A0[2][2]), gain = resp.raman ? .35*resp.n0/resp.nd*s : 0;
    const A = resp.A0.map((row,a)=> row.map((x,c)=> k*(x + gain*resp.dA[a][c])));
    ellip.matrix.set(A[0][0],A[0][1],A[0][2],0, A[1][0],A[1][1],A[1][2],0, A[2][0],A[2][1],A[2][2],0, 0,0,0,1); ellip.matrixWorldNeedsUpdate = true;
  }

  axesGroup.visible = S.axes;
  const hot = activeOp ? activeOp.elems : [];
  ELEM_IDS.forEach(id => ELEM[id].set((S.elements && id !== 'inv') || hot.includes(id), hot.includes(id)));

  if (renderer){ placeCamera(); renderer.render(scene, camera); }

  // labels
  const lm = live.matrix;
  ATOMS.forEach((at,i) => putLabel(label('a'+i, at.html, 'atom'), cur[i].clone().applyMatrix4(lm), 14, -15, S.labels));
  [['x',V(AX+.45,0,0)],['y',V(0,AX+.45,0)],['z',V(0,0,AX+.45)]].forEach(([n,p]) => putLabel(label('ax'+n, n, 'axis'), p, 0, 0, S.axes && S.labels));
  // with all elements on, label only the C6 axis and σh; the others get a label while they are in use
  Object.entries(ELEM_LABELS).forEach(([id,[html,p,cls]]) => putLabel(label('e'+id, html, cls), p, id === 'Cz' ? 22 : 0, id === 'inv' ? -16 : 0, S.labels && (hot.includes(id) || (S.elements && (id === 'Cz' || id === 'sh')))));
}

/* ---------- stage controls ---------- */
$('opbar').insertAdjacentHTML('beforeend', CLASSES.map(c => `<button class="sop" data-op="${c.rep.id}" title="${c.rep.name}">${c.rep.html}</button>`).join('') + '<button class="sop reset" id="reset">Reset</button>');
$('opbar').addEventListener('click', e => { const b = e.target.closest('[data-op]'); if (b) applyOp(b.dataset.op); });
$('reset').addEventListener('click', () => { resetOp(); Object.assign(cam, DEFAULT_CAM); });
function syncToggles(){
  $('tg-axes').setAttribute('aria-pressed', S.axes);
  $('tg-elem').setAttribute('aria-pressed', S.elements);
  $('tg-labels').setAttribute('aria-pressed', S.labels);
}
$('tg-axes').onclick = () => { S.axes = !S.axes; syncToggles(); };
$('tg-elem').onclick = () => { S.elements = !S.elements; syncToggles(); };
$('tg-labels').onclick = () => { S.labels = !S.labels; syncToggles(); };

function renderShowing(){
  const el = $('showing');
  if (S.arrows === 'cart') el.innerHTML = `<div class="legend"><span><i style="background:var(--x)"></i>x</span><span><i style="background:var(--y)"></i>y</span><span><i style="background:var(--z)"></i>z</span></div>`;
  else if (S.arrows === 'field'){
    const f = FIELDS[S.fieldId];
    const partners = f.parts ? `<span class="partners" role="group" aria-label="Partner pattern">${f.partHTML.map((h,k) => `<button class="mini" data-part="${k}" aria-pressed="${S.part===k}">${k ? 'b' : 'a'}</button>`).join('')}</span>` : '';
    const r = (S.step === SPEC_STEP || S.step === RA_STEP) && response(S.fieldId, S.part);
    const readout = !r ? '' : S.step === SPEC_STEP ? `<span class="rd">Δμ <b class="${r.ir?'on':''}">${r.ir ? 'oscillates' : 'zero'}</b></span>` : `<span class="rd">Δα <b class="${r.raman?'on2':''}">${r.raman ? 'oscillates' : 'zero'}</b></span>`;
    el.innerHTML = `<span><b>${f.html}</b> ${f.kind==='vib' ? f.name : ''}</span>${partners}<button class="mini" id="play">${S.playing ? 'Pause' : 'Play'}</button>${readout}`;
    $('play').onclick = () => { S.playing = !S.playing; renderShowing(); };
    el.querySelectorAll('[data-part]').forEach(b => b.onclick = () => { S.part = +b.dataset.part; resetOp(); renderShowing(); });
  } else el.innerHTML = '';
}
function setArrows(kind, fieldId){
  const id = kind === 'field' ? fieldId : null;
  if (id !== S.fieldId) S.part = 0;
  S.arrows = kind; S.fieldId = id;
  resetOp(); renderShowing();
}

/* ---------- lesson steps ---------- */
const repButtons = () => `<div class="btnrow">${CLASSES.map(c => `<button class="btn sm" data-op="${c.rep.id}">${c.rep.html}</button>`).join('')}</div>`;
const classHead = (first='') => `<thead><tr><th>${first}</th>${CLASSES.map(c => `<th>${c.html}</th>`).join('')}</tr></thead>`;
const charCells = ch => ch.map(c => `<td>${fmt(c)}</td>`).join('');
// hl underlines translations and rotations (step 6); sel = 'ir' underlines only x, y, z (step 8), sel = 'ra' only the quadratic functions (step 9)
function charTable(hl, sel){
  const fn = (ir) => {
    const lin = ir.lin.map(s => hl && sel !== 'ra' ? `<mark class="tr">${s}</mark>` : s), rot = ir.rot.map(s => hl && !sel ? `<mark class="ro">${s}</mark>` : s);
    return [...lin, ...rot].join(', ');
  };
  const quad = ir => sel === 'ra' && ir.quad ? `<mark class="qd">${ir.quad}</mark>` : ir.quad;
  return `<div class="tablewrap"><table>${classHead('D<sub>6h</sub>').replace('</tr>','<th></th><th></th></tr>')}<tbody>${
    IRREPS.map(ir => `<tr><th>${chip(ir)}</th>${charCells(ir.chi)}<td class="fn">${fn(ir)}</td><td class="fn">${quad(ir)}</td></tr>`).join('')
  }</tbody></table></div>`;
}
const isTR = id => id && FIELDS[id] && FIELDS[id].kind !== 'vib';
const isMode = id => id && FIELDS[id] && FIELDS[id].kind === 'vib';
const matches = tests => IRREPS.filter(ir => Object.entries(tests).every(([cls,v]) => ir.chi[classIdx(cls)] === v));

const STEPS = [
  {short:'Count motions', enter(){ setArrows('none'); S.elements = false; }, html(){ return `
    <p class="eyebrow">Step 1 of 9</p>
    <h2>Count the ways benzene can move</h2>
    <p>Describing where every atom of an <i>N</i>-atom molecule is takes 3<i>N</i> coordinates. Benzene, C<sub>6</sub>H<sub>6</sub>, has <i>N</i> = 12, so it has <strong>36 degrees of freedom</strong>.</p>
    <div class="dof" role="img" aria-label="36 degrees of freedom split into 3 translations, 3 rotations and 30 vibrations">
      <div class="s t"><b>3</b><span>translations</span></div>
      <div class="s r"><b>3</b><span>rotations</span></div>
      <div class="s v"><b>30</b><span>vibrations (3<i>N</i> − 6)</span></div>
    </div>
    <p>Benzene is nonlinear, so 3<i>N</i> − 6 = 30 of those motions are vibrations. Working out their symmetries by staring at the molecule would be hopeless. The same three-stage plan you used for water and ammonia does it mechanically:</p>
    <ul>
      <li>Build a reducible representation, ${G3N}, from all 36 motions.</li>
      <li>Reduce it to a sum of irreducible representations.</li>
      <li>Remove the parts that belong to translations and rotations. What remains is ${GV}.</li>
    </ul>
    <h3>Point group and axes</h3>
    <p>Benzene is a flat regular hexagon and belongs to <strong>D<sub>6h</sub></strong>. It has 24 symmetry operations in 12 classes: rotations about the sixfold axis, two kinds of 180° flips about axes in the plane (<i>C</i><sub>2</sub>′ and <i>C</i><sub>2</sub>″), the inversion <i>i</i>, two kinds of improper rotation (<i>S</i><sub>3</sub> and <i>S</i><sub>6</sub>), and three kinds of mirror plane. The order of the group is <i>h</i> = 24.</p>
    <p>That sounds like a lot, but there is good news: most of these operations move every atom, so most characters will be zero.</p>
    <p>The <i>z</i> axis runs along the <i>C</i><sub>6</sub> axis, perpendicular to the ring, and the <i>x</i> axis passes through C<sub>1</sub> and H<sub>1</sub>. Books disagree about which in-plane 180° axes are called <i>C</i><sub>2</sub>′ and which <i>C</i><sub>2</sub>″, and which vertical planes are σ<sub>v</sub> and which σ<sub>d</sub>. Here <i>C</i><sub>2</sub>′ and σ<sub>v</sub> pass through atoms. Swapping the convention swaps the labels B<sub>1</sub> and B<sub>2</sub>, just as the <i>xz</i>/<i>yz</i> choice did for water.</p>
    <p class="hint">Not sure how to get the point group? <a href="point-groups.html#benzene">Walk through the flowchart for benzene</a>, or look up any term in the <a href="glossary.html">glossary</a>.</p>
    <div class="callout"><strong>Try it.</strong> Drag the molecule to turn it, scroll to zoom, and turn on <em>Symmetry elements</em> above the model to see the sixfold axis, the molecular plane and the six vertical mirror planes.</div>`; }},

  {short:'Operations', enter(){ setArrows('none'); S.elements = true; }, html(){
    const rows = CLASSES.map(c => {
      const op = c.ops.find(o => S.seenOps[o.id]), um = op && unmoved(op);
      return `<tr><th>${c.html}</th><td class="desc">${c.desc}</td><td><button class="btn sm" data-op="${c.rep.id}">Apply ${c.rep.html}</button></td><td>${op ? `<b>${um.length}</b>` : '<span class="muted">?</span>'}</td></tr>`;
    }).join('');
    const allSeen = CLASSES.every(c => c.ops.some(o => S.seenOps[o.id]));
    return `
    <p class="eyebrow">Step 2 of 9</p>
    <h2>Watch each kind of symmetry operation</h2>
    <p>A symmetry operation moves the molecule into a position you cannot tell apart from where it started. Operations in the same class always behave the same way, so you only need to try one from each of the 12 classes. Note how many atoms <strong>stay exactly where they were</strong>.</p>

  {short:'Vector basis', enter(){ setArrows('cart'); S.elements = false; }, html(){

    ${done ? `<div class="callout"><strong>That row is ${G3N}.</strong> Eight of its twelve characters are zero. Next you will see a faster way to get it.</div>` : '<p class="hint">Apply one operation from each class to complete the row.</p>'}`; }},

  {short:'Build Γ3N', enter(){ setArrows('none'); S.elements = false; }, html(){
    const g = gamma3N();
    const mats = ['C6','S3','C2p1'].map(id => OPS.find(op => op.id === id)).map(op => `<div class="mat"><span class="t">${op.html}</span><div class="grid">${op.M.flat().map((v,k)=>`<span class="${k%4===0?'d':''}">${nice(v)}</span>`).join('')}</div><span class="tr">trace = ${nice(trace(op.M))}</span></div>`).join('');
    const c = S.check4;
    const rows = CLASSES.map((cl,k) => `<tr><th>${cl.html}</th><td>${unmoved(cl.rep).length}</td><td>${nice(trace(cl.rep.M))}</td><td><input class="cell-in ${c ? (c[k] ? 'ok':'no') : ''}" id="g3n-${cl.id}" autocomplete="off" aria-label="χ(Γ3N) for ${cl.id}" value="${S.inputs['g3n-'+cl.id] ?? ''}"></td></tr>`).join('');

    <p class="eyebrow">Step 4 of 9</p>
    <h2>Build ${G3N} with the shortcut</h2>

    ${c ? (allOk ? `<p class="fb ok">Correct. ${G3N} = ${g.map(fmt).join(', ')}. These match the tally from step 3.</p>` : `<p class="fb no">Some entries are off. Multiply the two numbers beside each box.</p>`) : ''}`; }},

  {short:'Reduce', enter(){ setArrows('none'); S.elements = false; }, html(){
    const g = gamma3N(), n = reduce(g), c = S.check5;
    const nz = CLASSES.map((cl,j) => j).filter(j => g[j] !== 0);
    const rows = IRREPS.map((ir,k) => `<tr><th>${chip(ir)}</th><td><input class="cell-in ${c ? (c[k] ? 'ok':'no') : ''}" id="n-${ir.id}" inputmode="numeric" autocomplete="off" aria-label="number of ${ir.id}" value="${S.inputs['n-'+ir.id] ?? ''}"></td></tr>`).join('');

    <p class="eyebrow">Step 5 of 9</p>

    ${charTable(false)}
    <div class="tablewrap"><table>${classHead()}<tbody><tr class="total"><th>χ(${G3N})</th>${charCells(g)}</tr></tbody></table></div>
    <h3>Your turn</h3>
    <div class="tablewrap"><table><thead><tr><th>Species</th><th>Times it appears</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="btnrow"><button class="btn primary" data-action="check5">Check</button><button class="btn" data-action="work5">${S.showWork ? 'Hide working' : 'Show working'}</button></div>
    ${c ? (allOk ? `<p class="fb ok">Correct.</p>` : `<p class="fb no">Not quite. Open the working to see where your sum differs. Did you multiply by <i>g</i>?</p>`) : ''}
    ${S.showWork ? `<div class="work">${work}</div>` : ''}
    ${allOk || S.showWork ? `<div class="result"><span class="lhs">${G3N} =</span><span class="rep">${repHTML(n)}</span><span class="muted">Degrees of freedom check, counting each E as two: ${n.reduce((s,x,k)=> s + x*IRREPS[k].chi[0], 0)} = 3<i>N</i></span></div>` : ''}`; }},

  {short:'Remove T & R', enter(){ if (isTR(S.fieldId)) setArrows('field', S.fieldId); else setArrows('none'); S.elements = false; }, html(){
    const g = gamma3N(), gt = sumChars(['Tz','Txy']), gr = sumChars(['Rz','Rxy']);
    const gv = g.map((x,k) => x - gt[k] - gr[k]);
    const motion = id => { const f = FIELDS[id], ir = irrepOf(fieldChars(id)); return `<button class="motion ${S.fieldId===id?'active':''}" data-field="${id}"><span class="nm">${f.html}</span><span class="ir">${S.motionSeen[id] ? chip(ir) : 'Show me'}</span></button>`; };
    const allSeen = Object.keys(FIELDS).filter(isTR).every(id => S.motionSeen[id]);
    const rows = CLASSES.map((cl,k) => `<tr><th>${cl.html}</th><td>${fmt(g[k])}</td><td class="z">${fmt(gt[k])}</td><td class="z">${fmt(gr[k])}</td><td>${S.vibRevealed ? fmt(gv[k]) : '<span class="muted">?</span>'}</td></tr>`).join('');

    <p class="eyebrow">Step 6 of 9</p>
    <h2>Remove translations and rotations</h2>
    <p>${G3N} contains every motion, including the six that do not stretch or bend anything. The character table says where they live: translations transform like <i>z</i> and (<i>x</i>, <i>y</i>), and rotations like R<sub><i>z</i></sub> and (R<sub><i>x</i></sub>, R<sub><i>y</i></sub>).</p>

    <div class="motions">${['Tz','Txy','Rz','Rxy'].map(motion).join('')}</div>
    ${allSeen ? `<p class="fb ok">${GT} = ${repHTML(reduce(gt))} and ${GR} = ${repHTML(reduce(gr))}.</p>` : ''}
    <h3>Subtract</h3>
    <div class="tablewrap"><table><thead><tr><th>Class</th><th>${G3N}</th><th>− ${GT}</th><th>− ${GR}</th><th>${GV}</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${S.vibRevealed ? `
      <div class="result"><span class="lhs">${GV} =</span><span class="rep">${repHTML(reduce(gv))}</span></div>
      <p>Or subtract the reduced forms directly: remove one A<sub>2u</sub> and one E<sub>1u</sub> for the translations, and one A<sub>2g</sub> and one E<sub>1g</sub> for the rotations. That leaves 30 vibrations, as 3<i>N</i> − 6 predicted, but only <strong>${SPECIES.reduce((s,sp)=> s + sp.n, 0)} distinct frequencies</strong>, because ${SPECIES.filter(sp => sp.ir.chi[0] === 2).reduce((s,sp)=> s + sp.n, 0)} of them are degenerate E pairs, each counting as two vibrations.</p>`

  {short:'Normal modes', enter(){ setArrows('field', isMode(S.fieldId) ? S.fieldId : MODES[0]); S.elements = false; }, html(){
    const cur = isMode(S.fieldId) && FIELDS[S.fieldId].species;
    const cards = SPECIES.map((sp, k) => {
      const tests = S.modeTests[sp.ir.id] || {}, left = matches(tests), known = Object.keys(tests).length && left.length === 1;
      const two = sp.ir.chi[0] === 2, inPlane = sp.ir.chi[classIdx('sh')] > 0;
      const boxes = CLASSES.map(c => { const v = tests[c.id]; return v === undefined ? '' : `<span class="cbox">${c.html} <b class="${v>0?'p1':v<0?'m1':''}">${fmtS(v)}</b></span>`; }).join('');
      const status = !Object.keys(tests).length ? '<span class="muted">apply operations to narrow it down</span>' : known ? chip(left[0]) : `<span class="muted">${left.length} rows of the table still match</span>`;
      return `<article class="mode ${cur===sp.ir.id?'active':''}">

        <div class="btnrow tight">${sp.ids.map((id,j) => `<button class="btn sm ${S.fieldId===id?'active':''}" data-field="${id}" title="${FIELDS[id].name}">Pattern ${j+1}</button>`).join('')}</div>
        <div class="chars">${boxes} <span>→ ${status}</span></div>

    const found = SPECIES.every(sp => { const t = S.modeTests[sp.ir.id] || {}; return Object.keys(t).length && matches(t).length === 1; });
    return `
    <p class="eyebrow">Step 7 of 9</p>
    <h2>Identify the vibrations by their symmetry</h2>
    <p>${GV} = ${repHTML(vibIrreps())}: 20 distinct frequencies in 10 symmetry species. The cards below group benzene's measured fundamentals into those 10 sets, without saying which set is which. Your job is to identify them.</p>

    ${found ? `<div class="callout"><strong>All ten sets identified.</strong> The symmetry of every one of benzene's 30 vibrations follows from the character table alone.</div>` : ''}
    <p>Next: which of these vibrations can you actually see in a spectrum?</p>`; }},

  {short:'IR', enter(){ setArrows('field', isMode(S.fieldId) ? S.fieldId : MODES[0]); S.elements = false; }, html(){ return selectionStep('ir'); }},
  {short:'Raman', enter(){ setArrows('field', isMode(S.fieldId) ? S.fieldId : MODES[0]); S.elements = false; }, html(){ return selectionStep('ra'); }},
];
const SPEC_STEP = STEPS.length - 2, RA_STEP = STEPS.length - 1;

/* ---------- steps 8 and 9: selection rules ---------- */
const SPEC_NOTE = `Benzene has a centre of inversion, so mutual exclusion applies. Its IR bands (A<sub>2u</sub> and E<sub>1u</sub>, both <i>u</i>) and its Raman bands (A<sub>1g</sub>, E<sub>1g</sub> and E<sub>2g</sub>, all <i>g</i>) never belong to the same vibration, even where two numbers look almost equal, like 3062 and 3063 cm<sup>−1</sup>. And 9 of the 20 fundamentals, in A<sub>2g</sub>, B<sub>2g</sub>, B<sub>1u</sub>, B<sub>2u</sub> and E<sub>2u</sub>, are silent in both. Chemists located them from overtones and combination bands, neutron scattering and the spectra of deuterated benzenes.`;
const KIND = {
  ir:{name:'IR', long:'infrared', test:irActive, why:ir => irActive(ir) ? `like ${ir.lin.join(', ')}` : 'no <i>x</i>, <i>y</i> or <i>z</i>'},
  ra:{name:'Raman', long:'Raman', test:ramanActive, why:ir => ramanActive(ir) ? `like ${ir.quad}` : 'no quadratic function'},
};
function spectrumSVG(kinds){
  const W = 600, PH = 62, GAP = 30, TOP = 20, X = wn => 34 + (4000 - wn)/3600*(W - 54);
  const panels = kinds.map(k => [k === 'ir' ? 'Infrared' : 'Raman', k, KIND[k].test]);
  let svg = '';
  panels.forEach(([name, cls, test], p) => {
    const y0 = TOP + p*(PH + GAP), base = y0 + PH;
    svg += `<text class="pl" x="0" y="${y0 - 6}">${name}</text><line class="base" x1="34" x2="${W - 20}" y1="${base}" y2="${base}"/>`;
    const bands = MODES.flatMap(id => { const ir = irrepOf(fieldChars(id)); return test(ir) ? FIELDS[id].bands.map(wn => ({ir, wn})) : []; }).sort((a,b) => b.wn - a.wn);
    // bands closer than a few pixels share one stick, and its tooltip lists them all
    const sticks = bands.reduce((out, b) => { const s = out[out.length - 1]; if (s && X(b.wn) - X(s[s.length - 1].wn) < 5) s.push(b); else out.push([b]); return out; }, []);
    let lastX = -99;
    sticks.forEach(s => {
      const x = X(s[0].wn), lab = x - lastX > 36; if (lab) lastX = x;   // label only where it won't collide; the tooltip carries the rest
      svg += `<g data-tip="${s.map(b => `${b.ir.html} · ${b.wn} cm<sup>−1</sup>`).join('<br>')}"><line class="stick ${cls}" x1="${x}" x2="${x}" y1="${base}" y2="${y0 + 16}"/><circle class="${cls}" cx="${x}" cy="${y0 + 16}" r="4"/>${lab ? `<text class="lb" x="${x}" y="${y0 + 6}" text-anchor="middle">${s[0].wn}</text>` : ''}<rect class="hit" x="${x - 8}" y="${y0}" width="16" height="${PH}"/></g>`;
    });
    if (!bands.length) svg += `<text class="lb" x="${W/2}" y="${y0 + PH/2}" text-anchor="middle">no fundamentals</text>`;
  });
  const ay = TOP + panels.length*PH + (panels.length - 1)*GAP + 16;
  for (let t = 4000; t >= 500; t -= 500) svg += `<text class="ax" x="${X(t)}" y="${ay}" text-anchor="middle">${t}</text>`;
  svg += `<text class="ax" x="${(W + 14)/2}" y="${ay + 18}" text-anchor="middle">wavenumber / cm⁻¹</text>`;
  return `<div class="spec"><svg viewBox="0 0 ${W} ${ay + 24}" role="img" aria-label="Predicted ${kinds.map(k => KIND[k].long).join(' and ')} stick ${kinds.length > 1 ? 'spectra' : 'spectrum'}">${svg}</svg><div class="tip"></div></div>`;
}
function selectionStep(kind){
  const K = KIND[kind], nv = vibIrreps();
  const c = S.chk[kind], done = S.rev[kind] || (c && Object.values(c).every(Boolean));
  const yn = sp => {
    const v = (S.sel[sp.ir.id] || {})[kind], st = c ? (c[sp.ir.id] ? 'ok' : 'no') : '';
    return `<span class="yn ${st}" role="group" aria-label="${K.name} active for ${sp.ir.id}"><button data-yn="${sp.ir.id}|${kind}|1" aria-pressed="${v === true}">Yes</button><button data-yn="${sp.ir.id}|${kind}|0" aria-pressed="${v === false}">No</button></span>`;
  };
  const rows = SPECIES.map(sp => `<tr><th>${chip(sp.ir)} <span class="muted">${WN[sp.ir.id].join(', ')}</span></th><td>${yn(sp)}</td>${done ? `<td class="fn">${K.why(sp.ir)}</td>` : ''}</tr>`).join('');
  const count = test => MODES.filter(id => test(irrepOf(fieldChars(id)))).length;
  const n = count(K.test);
  const silent = SPECIES.filter(sp => !irActive(sp.ir) && !ramanActive(sp.ir));
  const both = SPECIES.filter(sp => irActive(sp.ir) && ramanActive(sp.ir));
  const btns = `<div class="btnrow">${MODES.map(id => `<button class="btn sm ${S.fieldId===id?'active':''}" data-field="${id}" title="${FIELDS[id].name}">${IRREPS.find(ir => ir.id === FIELDS[id].species).html} ${FIELDS[id].wn}</button>`).join('')}</div>`;
  const intro = kind === 'ir' ? `
    <h2>Which vibrations absorb infrared light?</h2>
    <p>Light can only excite a vibration if the vibration changes something the light's oscillating electric field can push on. <strong>Infrared absorption</strong> needs the vibration to change the <strong>dipole moment</strong> μ. The dipole is a vector, and its components μ<sub><i>x</i></sub>, μ<sub><i>y</i></sub>, μ<sub><i>z</i></sub> transform like <i>x</i>, <i>y</i> and <i>z</i>.</p>
    <h3>Watch it happen</h3>
    <p>Pick a vibration. The <strong>pink arrow</strong> is the change in dipole, Δμ, worked out from partial charges on the atoms. If the arrow never appears, the vibration cannot absorb IR. Benzene has no permanent dipole, so for most vibrations the arrow never appears at all.</p>
    ${btns}
    <p class="hint">This is a toy model, but it respects the molecule's symmetry, so it always agrees with the group theory below. For a degenerate pair, try both partners.</p>
    <h3>The group theory shortcut</h3>
    <p>The strength of a transition from the ground state to the first excited level of a vibration depends on the integral ⟨0|μ|1⟩. An integral over all space is zero unless its integrand is totally symmetric. The ground state is totally symmetric, and the excited level has the symmetry of the vibration, so the integral can only survive if the vibration has the same symmetry as one of μ<sub><i>x</i></sub>, μ<sub><i>y</i></sub>, μ<sub><i>z</i></sub>. You found each vibration's irreducible representation in step ${SPEC_STEP}.</p>
    <div class="callout"><strong>Rule:</strong> a vibration is <strong>IR active</strong> if its row of the character table lists <i>x</i>, <i>y</i> or <i>z</i> (underlined in orange below).</div>` : `
    <h2>Which vibrations show up in the Raman spectrum?</h2>
    <p><strong>Raman scattering</strong> needs the vibration to change the <strong>polarizability</strong> α, how easily the electron cloud is distorted. α is a 3 × 3 tensor, and its components α<sub><i>xx</i></sub>, α<sub><i>xy</i></sub>, … transform like the quadratic functions <i>x</i><sup>2</sup>, <i>xy</i>, ….</p>
    <h3>Watch it happen</h3>
    <p>Pick a vibration. The <strong>translucent shape</strong> is the polarizability ellipsoid, from a simple model in which each bond is easier to polarize along its length. If the ellipsoid holds still, the vibration cannot Raman scatter.</p>
    ${btns}
    <p class="hint">This is a toy model, but it respects the molecule's symmetry, so it always agrees with the group theory below. For a degenerate pair, try both partners.</p>
    <h3>The group theory shortcut</h3>
    <p>The same argument as for IR, with α in place of μ: ⟨0|α|1⟩ survives only if the vibration has the same symmetry as one of the components of α.</p>
    <div class="callout"><strong>Rule:</strong> a vibration is <strong>Raman active</strong> if its row of the character table lists a quadratic function such as <i>x</i><sup>2</sup>, <i>z</i><sup>2</sup> or <i>xy</i> (underlined in blue below).</div>`;
  return `
    <p class="eyebrow">Step ${(kind === 'ir' ? SPEC_STEP : RA_STEP) + 1} of ${STEPS.length}</p>
    ${intro}
    ${charTable(true, kind)}
    <h3>Your turn</h3>
    <p>For each symmetry species in ${GV} = ${repHTML(nv)}, decide whether it is ${K.name} active.</p>
    <div class="tablewrap"><table><thead><tr><th>Species</th><th>${K.name} active?</th>${done ? '<th>Why</th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="btnrow"><button class="btn primary" data-action="check" data-kind="${kind}">Check</button><button class="btn" data-action="reveal" data-kind="${kind}">Show answer</button></div>
    ${c && !done ? `<p class="fb no">Not quite. Look along each species' row: ${kind === 'ir' ? 'is there an <i>x</i>, <i>y</i> or <i>z</i>?' : 'is there a quadratic function?'}</p>` : ''}
    ${done ? `${c && !S.rev[kind] ? '<p class="fb ok">Correct.</p>' : ''}
      <h3>The predicted ${K.long} spectrum</h3>
      <p>Each ${K.name}-active fundamental gives one band. A degenerate pair gives a single band, because both partners have the same frequency. Prediction: <strong>${n}</strong> ${K.name} band${n === 1 ? '' : 's'}.</p>
      ${spectrumSVG([kind])}
      <p class="hint">Stick heights are not intensities: group theory says whether a band can appear, not how strong it is. Hover a stick for details. Real spectra also show weaker overtone and combination bands.</p>
      ${kind === 'ra' ? `
      <h3>IR and Raman together</h3>
      <p>${both.length ? `Species that are both IR and Raman active: ${both.map(sp => chip(sp.ir)).join(' ')}.` : 'No species is both IR and Raman active.'} ${silent.length ? `The ${silent.reduce((s,sp)=> s + sp.n, 0)} fundamentals in ${silent.map(sp => chip(sp.ir)).join(' ')} are silent in both: they exist, but neither technique sees them directly.` : 'No vibration is silent: every one shows up somewhere.'}</p>
      ${spectrumSVG(['ir','ra'])}
      <h3>Centres of inversion and mutual exclusion</h3>
      <p>If a molecule has a centre of inversion, <i>x</i>, <i>y</i> and <i>z</i> all change sign under <i>i</i> (they are <i>u</i>), and every quadratic function keeps its sign (<i>g</i>). So a <i>u</i> vibration can only be IR active and a <i>g</i> vibration can only be Raman active. No vibration can be both: this is the <strong>rule of mutual exclusion</strong>.</p>
      <p>${SPEC_NOTE}</p>` : ''}` : ''}`;
}

function renderStepper(){
  $('stepper').innerHTML = STEPS.map((s,i) => `<li><button data-step="${i}" ${i===S.step?'aria-current="step"':''} class="${i<S.step?'done':''}"><span class="n">${i+1}</span>${s.short.replace('Γ3N', G3N)}</button></li>`).join('');
}
function renderLesson(){
  $('body').innerHTML = STEPS[S.step].html();
  $('prev').disabled = S.step === 0; $('next').disabled = S.step === STEPS.length - 1;
  $('next').style.visibility = S.step === STEPS.length - 1 ? 'hidden' : '';
}
function goStep(i, scroll){
  S.step = Math.max(0, Math.min(STEPS.length-1, i));
  STEPS[S.step].enter(); syncToggles(); renderStepper(); renderLesson(); renderShowing();
  if (scroll) $('lesson').scrollIntoView({block:'start', behavior: reduced ? 'auto' : 'smooth'});
}
$('stepper').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) goStep(+b.dataset.step, true); });
$('prev').onclick = () => goStep(S.step - 1, true);
$('next').onclick = () => goStep(S.step + 1, true);

$('body').addEventListener('input', e => { if (e.target.id){ S.inputs[e.target.id] = e.target.value; e.target.classList.remove('ok','no'); } });
$('body').addEventListener('click', e => {
  const opB = e.target.closest('[data-op]'); if (opB){ applyOp(opB.dataset.op); return; }
  const fB = e.target.closest('[data-field]');
  if (fB){ const id = fB.dataset.field; S.motionSeen[id] = true; setArrows('field', id); renderLesson(); return; }
  const ynB = e.target.closest('[data-yn]');
  if (ynB){ const [ir, key, v] = ynB.dataset.yn.split('|'); (S.sel[ir] ||= {})[key] = v === '1'; S.chk[key] = null; S.rev[key] = false; renderLesson(); return; }
  const a = e.target.closest('[data-action]'); if (!a) return;
  const kind = a.dataset.kind;
  const g = gamma3N(), n = reduce(g);
  const vib = SPECIES.map(sp => sp.ir);
  switch (a.dataset.action){
    case 'check': S.chk[kind] = {}; vib.forEach(ir => { S.chk[kind][ir.id] = (S.sel[ir.id] || {})[kind] === KIND[kind].test(ir); }); break;
    case 'reveal': vib.forEach(ir => (S.sel[ir.id] ||= {})[kind] = KIND[kind].test(ir)); S.rev[kind] = true; S.chk[kind] = null; break;
    case 'check4': S.check4 = CLASSES.map((c,k) => parseNum(S.inputs['g3n-'+c.id]) === g[k]); break;
    case 'reveal4': CLASSES.forEach((c,k) => S.inputs['g3n-'+c.id] = fmt(g[k])); S.check4 = CLASSES.map(() => true); break;
    case 'check5': S.check5 = IRREPS.map((ir,k) => parseNum(S.inputs['n-'+ir.id]) === n[k]); break;
    case 'work5': S.showWork = !S.showWork; break;
    case 'vib': S.vibRevealed = true; break;
  }
  renderLesson();
});
// spectrum tooltips
$('body').addEventListener('pointermove', e => {
  if (!document.querySelector('.spec .tip')) return;
  const t = e.target.closest('[data-tip]');
  document.querySelectorAll('.tip').forEach(x => { if (!t || !x.parentElement.contains(t)) x.style.display = 'none'; });
  if (!t) return;
  const box = t.closest('.spec'), tp = box.querySelector('.tip'), bb = box.getBoundingClientRect(), r = t.getBoundingClientRect();
  tp.innerHTML = t.dataset.tip; tp.style.display = 'block';
  tp.style.left = (r.left + r.width/2 - bb.left) + 'px'; tp.style.top = (r.top - bb.top) + 'px';
});

buildModel();
goStep(0, false);
resize(); requestAnimationFrame(frame);
})();
</script>

</body>
