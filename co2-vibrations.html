<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carbon Dioxide Vibrations in D∞h</title>
<meta name="description" content="An interactive lesson on the vibrational modes of carbon dioxide using the D∞h point group and its subgroup D2h.">
<meta name="color-scheme" content="light dark">
<style>
/* Layout: a sticky 3D "lab bench" on the left, the worked lesson on the right; on phones the bench pins to the top */
:root{
  --bg:#edf0f4; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#16202b; --muted:#5a6775; --line:#d5dce5;
  --accent:#1f56c9; --accent-soft:#e2eafb; --accent-ink:#ffffff;
  --good:#1d7548; --good-soft:#dff2e7; --bad:#b4372e; --bad-soft:#fbe5e2;
  --a1:#1d7548; --a2:#7647b5; --e:#b8640f; --b1:#b8640f; --b2:#1a7aa1;
  --stage:#0c141d; --stage-2:#142131; --stage-ink:#dbe5ee; --stage-muted:#8a9bab; --stage-line:#26384c;
  --x:#f2a23a; --y:#45d0a0; --z:#93a6ff; --mode:#ffd35c;
  --display:"Segoe UI", Calibri, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --body:"Segoe UI", Calibri, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono:Consolas, "Cascadia Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --surface:#151c24; --surface-2:#1a232d; --ink:#e2e8ef; --muted:#93a1b0; --line:#28333f;
    --accent:#7aa2ff; --accent-soft:#1d2a45; --accent-ink:#0b1220;
    --good:#5fd09a; --good-soft:#143326; --bad:#ff8a7f; --bad-soft:#3a1c1a;
    --a1:#5fd09a; --a2:#b993f0; --e:#f0a85a; --b1:#f0a85a; --b2:#5cc2ea;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#151c24; --surface-2:#1a232d; --ink:#e2e8ef; --muted:#93a1b0; --line:#28333f;
  --accent:#7aa2ff; --accent-soft:#1d2a45; --accent-ink:#0b1220;
  --good:#5fd09a; --good-soft:#143326; --bad:#ff8a7f; --bad-soft:#3a1c1a;
  --a1:#5fd09a; --a2:#b993f0; --e:#f0a85a; --b1:#f0a85a; --b2:#5cc2ea;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
sub,sup{font-size:.72em;line-height:0}

.app{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);grid-template-areas:"stage head" "stage lesson";grid-template-rows:auto 1fr;column-gap:32px;padding-inline:16px;padding-block:16px;max-width:1520px;margin:0 auto}

/* ---------- header ---------- */
.head{grid-area:head;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding-block:6px 18px;border-bottom:1px solid var(--line)}
.brand .kicker{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{font:600 clamp(26px,3vw,34px)/1.1 var(--display);margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.back{font:500 13px var(--body);color:var(--accent);text-decoration:none;padding-bottom:4px}
.back:hover{text-decoration:underline}

/* ---------- stage ---------- */
.stage{grid-area:stage;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:480px;max-height:980px;border-radius:14px;overflow:hidden;background:var(--stage);color:var(--stage-ink);isolation:isolate}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;font:500 13px/1 var(--mono);color:var(--stage-ink);text-shadow:0 1px 3px #000c;white-space:nowrap;will-change:transform}
.lab.axis{font-style:italic;font-size:14px}
.lab.atom{font:600 14px/1 var(--body)}
.lab.elem{font:500 12px/1 var(--mono);color:#ffe28a;background:#0c141dcc;padding:3px 6px;border-radius:4px}
.lab.elem.sxy{color:#9cc3ff}.lab.elem.sxz{color:#e0b3ff}.lab.elem.syz{color:#ffb3cb}
.st-top{position:absolute;inset:12px 12px auto 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.st-top>*{pointer-events:auto}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--stage-line);background:#0c141dcc;color:var(--stage-muted);border-radius:999px;padding:4px 11px;font:500 12px var(--body);cursor:pointer}
.tg[aria-pressed="true"]{color:var(--stage-ink);border-color:#4b6380;background:var(--stage-2)}
.showing{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:#0c141dd9;border:1px solid var(--stage-line);border-radius:10px;padding:6px 10px;font-size:12.5px}
.showing:empty{display:none}
.legend{display:flex;gap:10px;font:500 12px var(--mono)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.mini{border:1px solid var(--stage-line);background:var(--stage-2);color:var(--stage-ink);border-radius:6px;padding:2px 8px;font:500 12px var(--body);cursor:pointer}
.mini[aria-pressed="true"]{background:#ffd35c;color:#1a1400;border-color:#ffd35c}
.partners{display:inline-flex;gap:4px}
.st-bottom{position:absolute;inset:auto 12px 12px 12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.caption{align-self:flex-start;max-width:min(100%,560px);background:#0c141de6;border:1px solid var(--stage-line);border-radius:10px;padding:8px 12px;font-size:13.5px;line-height:1.45;pointer-events:auto}
.caption b{color:#fff}
.opbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;pointer-events:auto;background:#0c141de6;border:1px solid var(--stage-line);border-radius:12px;padding:6px}
.opbar .lbl{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--stage-muted);padding:0 6px}
.sop{border:1px solid #33506e;background:var(--stage-2);color:var(--stage-ink);border-radius:8px;padding:6px 12px;font:500 14px var(--body);cursor:pointer;min-width:52px}
.sop:hover{border-color:#6f93bd;background:#1b2c41}
.sop.active{background:#ffd35c;color:#1a1400;border-color:#ffd35c}
.sop.reset{margin-left:auto;color:var(--stage-muted);min-width:0}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--stage-muted)}

/* ---------- lesson ---------- */
.lesson{grid-area:lesson;min-width:0;padding-block:18px 48px;scroll-margin-top:16px}
.stepper{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;list-style:none;padding:0}
.stepper button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 5px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.stepper button .n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-2);font:500 11px var(--mono);color:var(--muted)}
.stepper button[aria-current="step"]{border-color:var(--accent);color:var(--ink)}
.stepper button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.stepper button.done .n{background:var(--accent-soft);color:var(--accent)}
.body{max-width:66ch}
.eyebrow{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.body h2{font:600 26px/1.2 var(--display);margin:0 0 12px;text-wrap:balance}
.body h3{font:600 18px/1.3 var(--display);margin:26px 0 8px}
.body p{margin:0 0 12px}
.body ul{margin:0 0 12px;padding-left:20px}
.body li{margin-bottom:4px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;font-style:italic}
.callout{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:14.5px}
.callout strong{color:var(--accent)}
.formula{font:500 17px/1.6 var(--display);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0;text-align:center;overflow-x:auto}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 3px}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.mono{font-family:var(--mono)}

.dof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:14px 0 8px}
.dof .s{border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.dof .s b{font:600 24px/1 var(--display)}
.dof .s span{font-size:12.5px;color:var(--muted)}
.dof .t{background:var(--surface);border:1px solid var(--line)}
.dof .r{background:var(--surface);border:1px solid var(--line)}
.dof .v{background:var(--accent-soft);border:1px solid var(--accent)}
.dof .v b{color:var(--accent)}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.opcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.opcard:last-child:nth-child(odd){grid-column:1/-1}
.opcard header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.opsym{font:600 20px/1 var(--display)}
.opname{font-size:13px;color:var(--muted)}
.opcard p{font-size:14px;margin:0}
.um{font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px;margin-top:auto}
.um .lbl{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.um b{font:600 16px var(--mono);color:var(--good)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:500;align-self:flex-start}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btnrow.tight{margin:2px 0 0;gap:6px}

.tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child>th,tr:last-child>td{border-bottom:0}
thead th{font:500 13px var(--body);color:var(--muted);background:var(--surface-2)}
tbody th{text-align:left;font-weight:500}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.fn{font-family:var(--body);font-style:italic;color:var(--muted);text-align:left}
td.fn mark{background:none;color:var(--ink);font-weight:600}
td.fn mark.tr{box-shadow:inset 0 -2px 0 var(--e)}
td.fn mark.ro{box-shadow:inset 0 -2px 0 var(--a2)}
td.fn mark.qd{box-shadow:inset 0 -2px 0 var(--accent)}
tr.total th,tr.total td{background:var(--accent-soft);font-weight:600}
tr.sub td,tr.sub th{color:var(--muted)}
td.p1{color:var(--good);font-weight:600}
td.m1{color:var(--bad);font-weight:600}
td.z{color:var(--muted)}
td.q{color:var(--muted)}
.cell-in{width:58px;padding:5px 6px;text-align:center;font:500 14px var(--mono);border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink)}
.cell-in.ok{border-color:var(--good);background:var(--good-soft)}
.cell-in.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-size:14px;margin:6px 0 12px}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}

.chip{display:inline-flex;align-items:center;gap:5px;font:600 13.5px var(--body);color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:6px;padding:1px 7px;white-space:nowrap}
.chip.a1{--c:var(--a1)}.chip.a2{--c:var(--a2)}.chip.b1{--c:var(--b1)}.chip.b2{--c:var(--b2)}
.rep{font:600 18px var(--display)}
.result{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.result .lhs{font:600 18px var(--display)}

.matrices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.mat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mat .t{font:600 15px var(--display)}
.mat .grid{display:grid;grid-template-columns:repeat(3,30px);gap:2px 2px;font:500 13px var(--mono);text-align:center;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);padding:2px 4px;border-radius:3px}
.mat .grid span.d{color:var(--accent);font-weight:600}
.mat .tr{font:500 12px var(--mono);color:var(--muted)}

.work{font:14px/1.9 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;overflow-x:auto;white-space:nowrap}

.motions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.motion{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.motion:hover{border-color:var(--accent)}
.motion.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.motion .nm{font:600 15px var(--display)}
.motion .ir{font-size:13px;color:var(--muted)}

.modes{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.mode.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mode h4{margin:0;font:600 17px var(--display)}
.mode .wn{font:500 13px var(--mono);color:var(--muted)}
.mode p{grid-column:1/-1;margin:0;font-size:14px}
.mode .chars{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cbox{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:13px;background:var(--surface-2)}
.cbox b{font:600 13px var(--mono)}
.cbox b.p1{color:var(--good)}.cbox b.m1{color:var(--bad)}.cbox b.q{color:var(--muted)}

.yn{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;vertical-align:middle}
.yn button{border:0;background:var(--surface);padding:3px 10px;font:500 13px var(--body);cursor:pointer;color:var(--muted)}
.yn button+button{border-left:1px solid var(--line)}
.yn button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.yn.ok{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.yn.no{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.rd{font:500 12px var(--mono);color:var(--stage-muted)}
.rd b{color:var(--stage-ink)}.rd b.on{color:#ff8fc0}.rd b.on2{color:#8fdcff}
.spec{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 6px;margin:12px 0}
.spec svg{display:block;width:100%;height:auto;overflow:visible}
.spec .base{stroke:var(--line);stroke-width:1}
.spec .ax{font:500 11px var(--mono);fill:var(--muted)}
.spec .pl{font:600 13px var(--body);fill:var(--ink)}
.spec .lb{font:500 10.5px var(--mono);fill:var(--muted)}
.spec .stick{stroke-width:2;stroke-linecap:round}
.spec .ir{stroke:var(--e);fill:var(--e)}.spec .ra{stroke:var(--accent);fill:var(--accent)}
.spec circle{stroke:var(--surface);stroke-width:2}
.spec .hit{fill:transparent;stroke:none}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font:500 12px var(--body);padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));display:none;z-index:2}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "lesson";grid-template-rows:auto auto auto;row-gap:12px}
  .head{padding-block:2px 12px}
  .stage{top:env(safe-area-inset-top,0px);height:48dvh;min-height:320px;z-index:5;border-radius:12px}
  .lesson{scroll-margin-top:calc(48dvh + 16px);padding-top:6px}
  .lab.elem{display:none}
  .caption{font-size:12.5px;line-height:1.4;padding:6px 10px;max-height:4.6em;overflow-y:auto}
  .opbar{gap:4px;padding:4px}
  .sop{padding:4px 9px;min-width:42px;font-size:13px}
  .st-bottom{inset:auto 8px 8px 8px;gap:6px}
  .st-top{inset:8px 8px auto 8px}
}
@media (max-width:560px){
  .cards,.matrices{grid-template-columns:repeat(2,minmax(0,1fr))}
  .motions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .caption{font-size:12.5px;padding:6px 10px}
  .sop{padding:5px 8px;min-width:38px;font-size:13px}
  .opbar .lbl{display:none}
  .tg{font-size:11px;padding:3px 9px}
}
@media (max-width:400px){ .cards{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>

<div class="app">
  <header class="head">
    <div class="brand">
      <div class="kicker">Group theory · D<sub>∞h</sub> · CO<sub>2</sub></div>
      <h1>Carbon dioxide's vibrational modes</h1>
    </div>
    <a class="back" href="index.html">← All lessons</a>
  </header>

  <section class="stage" id="stage" aria-label="3D model of a carbon dioxide molecule">
    <canvas id="gl" tabindex="0" aria-label="Drag or use arrow keys to rotate. Scroll to zoom."></canvas>
    <div class="labels" id="labels"></div>
    <div class="st-top">
      <div class="toggles">
        <button class="tg" id="tg-axes" aria-pressed="true">Axes</button>
        <button class="tg" id="tg-elem" aria-pressed="false">Symmetry elements</button>
        <button class="tg" id="tg-labels" aria-pressed="true">Labels</button>
      </div>
      <div class="showing" id="showing"></div>
    </div>
    <div class="st-bottom">
      <div class="caption" id="caption"></div>
      <div class="opbar" id="opbar"><span class="lbl">Apply</span></div>
    </div>
  </section>

  <main class="lesson" id="lesson">
    <ol class="stepper" id="stepper"></ol>
    <div class="body" id="body"></div>
    <div class="nav">
      <button class="btn" id="prev">← Previous</button>
      <button class="btn primary" id="next">Next →</button>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const fmt = n => { n = Math.round(n*1000)/1000; if (n === 0) n = 0; return n < 0 ? '−' + (-n) : String(n); };
const fmtS = n => n > 0 ? '+' + n : fmt(n);
const parseNum = s => { if (s == null) return NaN; s = String(s).trim().replace(/[−–]/g,'-'); return s === '' ? NaN : Number(s); };
const snap = v => Math.abs(v - Math.round(v)) < 1e-6 ? Math.round(v) : v;
const nice = v => fmt(snap(v));   // every D2h matrix entry is 0 or ±1
const niceS = v => snap(v) > 0 ? '+' + nice(v) : nice(v);
const sq = v => `<i>${v}</i><sup>2</sup>`;

/* ---------- point group data ---------- */
// D∞h has infinitely many operations, so the bookkeeping is done in its subgroup D2h: the molecular axis, the centre and three perpendicular mirror planes
const D = (x,y,z) => [[x,0,0],[0,y,0],[0,0,z]];
const OPS = [
  {id:'E',   html:'<i>E</i>',                       name:'Identity',                         M:D(1,1,1),    kind:'E'},
  {id:'C2z', html:'<i>C</i><sub>2</sub>(<i>z</i>)', name:'180° rotation about z',            M:D(-1,-1,1),  kind:'rot', axis:[0,0,1], angle:Math.PI, elem:'C2z'},

/* ---------- molecular model (display units, centre of mass at origin) ---------- */
const SCALE = 1.7;
let ATOMS = [], FIELDS = {};
function mul(M,v){ return V(M[0][0]*v.x+M[0][1]*v.y+M[0][2]*v.z, M[1][0]*v.x+M[1][1]*v.y+M[1][2]*v.z, M[2][0]*v.x+M[2][1]*v.y+M[2][2]*v.z); }
const trace = M => M[0][0]+M[1][1]+M[2][2];

function buildModel(){
  // r(C=O) = 1.160 Å along z; carbon sits on the centre of mass
  const r = 1.160*SCALE;
  ATOMS = [
    {key:'C',  html:'C',             el:'C', pos:V(0,0,0)},
    {key:'O1', html:'O<sub>1</sub>', el:'O', pos:V(0,0,r)},
    {key:'O2', html:'O<sub>2</sub>', el:'O', pos:V(0,0,-r)},
  ];
  const MO = 16/12; // carbon recoil per unit oxygen displacement (m_O/m_C); carbon is the lighter atom, so this is drawn to true scale
  const norm = vecs => { const m = Math.max(...vecs.map(v=>v.length())); return vecs.map(v=>v.clone().multiplyScalar(0.85/m)); };
  const rot = ax => norm(ATOMS.map(at => ax.clone().cross(at.pos)));
  const tr = ax => ATOMS.map(() => ax.clone().multiplyScalar(0.75));
  const bend = ax => norm([ax.clone().multiplyScalar(2*MO), ax.clone().negate(), ax.clone().negate()]);   // both O one way, C the other
  // the bend is degenerate, so it carries two partner patterns in `parts`; everything else has a single `vecs`
  FIELDS = {
    Tx:{kind:'trans', html:'T<sub><i>x</i></sub>', name:'Translation along <i>x</i>', vecs:tr(V(1,0,0))},
    Ty:{kind:'trans', html:'T<sub><i>y</i></sub>', name:'Translation along <i>y</i>', vecs:tr(V(0,1,0))},
    Tz:{kind:'trans', html:'T<sub><i>z</i></sub>', name:'Translation along <i>z</i>', vecs:tr(V(0,0,1))},
    Rx:{kind:'rot', html:'R<sub><i>x</i></sub>', name:'Rotation about <i>x</i>', vecs:rot(V(1,0,0))},
    Ry:{kind:'rot', html:'R<sub><i>y</i></sub>', name:'Rotation about <i>y</i>', vecs:rot(V(0,1,0))},
    nu1:{kind:'vib', html:'ν<sub>1</sub>', name:'Symmetric stretch', wn:'1388 / 1285', bands:[1388,1285],
         desc:'Both C=O bonds lengthen and shorten together. The carbon does not move at all.',
         vecs:norm([V(0,0,0), V(0,0,1), V(0,0,-1)])},
    nu2:{kind:'vib', html:'ν<sub>2</sub>', name:'Bend', wn:'667', bands:[667],
         desc:'The molecule bends: both oxygens move one way and the carbon moves the other. It can bend in the <i>xz</i> plane or the <i>yz</i> plane, and the two bends have exactly the same frequency.',
         parts:[bend(V(1,0,0)), bend(V(0,1,0))], partHTML:['ν<sub>2a</sub> (<i>xz</i>)','ν<sub>2b</sub> (<i>yz</i>)']},
    nu3:{kind:'vib', html:'ν<sub>3</sub>', name:'Antisymmetric stretch', wn:'2349', bands:[2349],
         desc:'One C=O bond lengthens while the other shortens, so the carbon shuttles back and forth between the two oxygens.',
         vecs:norm([V(0,0,-2*MO), V(0,0,1), V(0,0,1)])},
  };
}
const fieldVecs = F => F.parts ? F.parts[S.part] : F.vecs;

function perm(op){ return ATOMS.map(at => { const w = mul(op.M, at.pos); return ATOMS.findIndex(b => b.pos.distanceTo(w) < 1e-3); }); }
function unmoved(op){ return perm(op).map((j,i)=> j===i ? i : -1).filter(i=>i>=0); }
const gamma3N = () => CLASSES.map(c => unmoved(c.rep).length * trace(c.rep.M));
// How the partner patterns Q_k of a motion mix under op: R·Q_k = Σ_l D[l][k] Q_l, so D = G⁻¹B with G = ⟨Q_l,Q_k⟩ and B = ⟨Q_l,R·Q_k⟩
function fieldMatrix(op, F){
  const Q = F.parts || [F.vecs], p = perm(op);
  const dot = (A,B) => A.reduce((s,a,i)=> s + a.dot(B[i]), 0);
  const RQ = Q.map(q => { const out = []; q.forEach((d,i) => out[p[i]] = mul(op.M, d)); return out; });
  const G = Q.map(a => Q.map(c => dot(a,c))), B = Q.map(a => RQ.map(rq => dot(a,rq)));
  if (Q.length === 1) return [[B[0][0]/G[0][0]]];
  const det = G[0][0]*G[1][1] - G[0][1]*G[1][0], Gi = [[G[1][1]/det, -G[0][1]/det], [-G[1][0]/det, G[0][0]/det]];
  return Gi.map(row => [0,1].map(k => row[0]*B[0][k] + row[1]*B[1][k]));
}
const fieldDiag = (op, F) => fieldMatrix(op, F).map((row,k) => snap(row[k]));
const fieldChar = (op, F) => Math.round(fieldDiag(op, F).reduce((a,c)=> a + c, 0));
const fieldChars = id => CLASSES.map(c => fieldChar(c.rep, FIELDS[id]));
const partChars = (id, k) => CLASSES.map(c => fieldChar(c.rep, {vecs:FIELDS[id].parts[k]}));
const sumChars = ids => CLASSES.map((c,k) => ids.reduce((s,id)=> s + fieldChars(id)[k], 0));
const reduce = ch => IRREPS.map(ir => ch.reduce((s,x,k)=> s + CLASSES[k].g*x*ir.chi[k], 0)/ORDER);
const irrepOf = ch => IRREPS.find(ir => ir.chi.every((c,k)=> c === ch[k]));
const repHTML = ns => ns.map((n,k)=> n ? `${n>1?n:''}${IRREPS[k].html}` : '').filter(Boolean).join(' + ') || '0';
// a motion's D∞h species is the one whose D2h correlation matches what the motion reduces to in D2h
const corrKey = ns => IRREPS.flatMap((ir,k) => Array(Math.round(ns[k])).fill(ir.id)).sort().join('+');
const speciesOf = id => DINF.find(s => [...s.corr].sort().join('+') === corrKey(reduce(fieldChars(id))));
function cartCells(op){
  const p = perm(op), E3 = [V(1,0,0),V(0,1,0),V(0,0,1)];
  return ATOMS.map((at,i) => E3.map(e => p[i] === i ? snap(mul(op.M,e).dot(e)) : null));
}

/* ---------- how a vibration couples to light (step 8) ---------- */
// toy models, symmetric by construction: point charges for the dipole, bond-additive polarizability
const CHARGE = [0.7, -0.35, -0.35];
const BONDS = [[0,1],[0,2]];
function polar(P){
  const A = [[0,0,0],[0,0,0],[0,0,0]];
  BONDS.forEach(([i,j]) => {
    const d = P[j].clone().sub(P[i]), L = d.length(), u = [d.x/L, d.y/L, d.z/L], par = L*L, perp = .3*L*L;   // each bond is easier to polarize along its length
    for (let a=0;a<3;a++) for (let c=0;c<3;c++) A[a][c] += (par - perp)*u[a]*u[c] + (a === c ? perp : 0);
  });
  return A;
}
let RESP = {};
function response(id, part){
  const k = id + ':' + part; if (RESP[k]) return RESP[k];
  const F = FIELDS[id], vecs = F.parts ? F.parts[part] : F.vecs, P = ATOMS.map(at => at.pos), eps = 1e-4;
  const dmu = vecs.reduce((s,v,i)=> s.addScaledVector(v, CHARGE[i]), V(0,0,0));
  const Ap = polar(P.map((p,i)=> p.clone().addScaledVector(vecs[i], eps))), Am = polar(P.map((p,i)=> p.clone().addScaledVector(vecs[i], -eps)));
  const dA = Ap.map((row,a)=> row.map((x,c)=> (x - Am[a][c])/(2*eps))), A0 = polar(P);
  const n0 = Math.hypot(...A0.flat()), nd = Math.hypot(...dA.flat());
  return RESP[k] = {dmu, ir:dmu.length() > 1e-6, A0, dA, n0, nd, raman:nd > 1e-5*n0};
}

function makeArrow(color, o={}){

function placeArrow(g, from, vec){
  const L = vec.length(); if (L < 1e-3){ g.visible = false; return; }
  g.visible = true;
  const {shaft, head, r, hr} = g.userData, hl = Math.min(g.userData.hl, L*.5);

// operation animation
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
function exactMatrix(op){ const M = op.M, m = new THREE.Matrix4(); m.set(M[0][0],M[0][1],M[0][2],0, M[1][0],M[1][1],M[1][2],0, M[2][0],M[2][1],M[2][2],0, 0,0,0,1); return m; }
// a reflection drawn as a squash through the mirror: e = 0 is the identity, e = 1 the mirror image
function squash(normal, e){
  let s = 1 - 2*e; if (Math.abs(s) < .02) s = s < 0 ? -.02 : .02;
  const [x,y,z] = normal, k = s - 1;
  return new THREE.Matrix4().set(1+k*x*x, k*x*y, k*x*z, 0,  k*y*x, 1+k*y*y, k*y*z, 0,  k*z*x, k*z*y, 1+k*z*z, 0,  0,0,0,1);
}
function opMatrix(op, e){
  if (op.kind === 'rot') return new THREE.Matrix4().makeRotationAxis(V(...op.axis), op.angle*e);
  if (op.kind === 'refl') return squash(op.normal, e);
  // i = σ(xy)·C2(z): turn half a revolution about the axis, then mirror through the xy plane
  if (op.kind === 'inv') return squash([0,0,1], Math.max(0, 2*e - 1)).multiply(new THREE.Matrix4().makeRotationAxis(V(0,0,1), Math.PI*Math.min(1, 2*e)));

}
function computeResult(op){
  const r = {op, unmoved:unmoved(op), kind:S.arrows};
  if (S.arrows === 'cart'){ r.cells = cartCells(op); r.chi = snap(r.cells.flat().reduce((s,c)=> s + (c||0), 0)); }
  if (S.arrows === 'field') { r.diag = fieldDiag(op, FIELDS[S.fieldId]); r.chi = fieldChar(op, FIELDS[S.fieldId]); r.fieldId = S.fieldId; }
  return r;
}
function applyOp(id){
  const op = OPS.find(o => o.id === id);

  S.anim = {op, t0:performance.now(), dur: reduced ? 1 : (op.kind === 'E' ? 800 : op.kind === 'inv' ? 2200 : 1600), result:computeResult(op)};
  setCaption(`Applying ${op.html}…`);
  markOpButtons(id);
}
function finishOp(){
  const r = S.anim.result; S.hold = {op:r.op, result:r}; S.anim = null;
  S.seenOps[r.op.id] = true;
  if (r.kind === 'cart'){ S.cart[r.op.id] = r; S.cartLast = r.op.id; }
  if (r.kind === 'field' && FIELDS[r.fieldId].kind === 'vib'){ (S.modeTests[r.fieldId] ||= {})[r.op.cls] = r.chi; }
  ghostMeshes.forEach((g,i) => { const um = r.unmoved.includes(i); g.material.color.setHex(um ? COL.halo : 0xffffff); g.material.opacity = um ? .3 : .1; });

}
function resetOp(){

function moveText(op){
  const moved = perm(op).map((j,i) => [i,j]).filter(([i,j]) => i !== j);
  return moved.length === 2 ? ` ${ATOMS[moved[0][0]].html} and ${ATOMS[moved[0][1]].html} have swapped places.` : '';
}
function resultCaption(r){

  let s = `<b>${r.op.html}</b> done. Unmoved atoms (green halo): <b>${names}</b>.` + moveText(r.op);
  if (r.kind === 'cart') s += ` Faint arrows show where the vectors started. Sum of +1/−1 on unmoved atoms: χ = <b>${fmt(r.chi)}</b>.`;
  if (r.kind === 'field'){
    const F = FIELDS[r.fieldId];
    if (!F.parts) s += r.chi > 0 ? ' The yellow pattern lands on itself: χ = <b>+1</b>.' : ' The yellow pattern is reversed: χ = <b>−1</b>.';
    else s += ` Each bend lands on ± itself: ${F.partHTML[0]} <b>${niceS(r.diag[0])}</b>, ${F.partHTML[1]} <b>${niceS(r.diag[1])}</b>. Together: χ = <b>${fmt(r.chi)}</b>.`;
  }
  return s;
}
function defaultCaption(){
  if (S.arrows === 'cart') return 'Nine unit vectors: <i>x</i>, <i>y</i>, <i>z</i> on each atom. Apply an operation and watch where each one ends up.';
  if (S.arrows === 'field'){

    if (F.parts) return `Showing ${F.partHTML[S.part]}, one of the two bends. Apply an operation: does each bend stay the same (+1) or reverse (−1)?`;
    return `Showing ${F.name.toLowerCase()}. Apply an operation: does the yellow pattern stay the same (+1) or reverse (−1)?`;
  }
  return 'Drag to rotate, scroll to zoom. Apply an operation to see what it does to the molecule.';
}

// camera orbit
const DEFAULT_CAM = {theta:-1.0, phi:1.25, r:9.6};   // side-on and a little further back, so the whole molecular axis fits on screen
const cam = {...DEFAULT_CAM};
function placeCamera(){
  const {theta, phi, r} = cam;
  camera.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
  camera.lookAt(0,0,0);
}
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.theta -= (e.clientX - drag.x) * .008;
  cam.phi = Math.min(Math.PI-.12, Math.max(.12, cam.phi - (e.clientY - drag.y) * .008));
  drag = {x:e.clientX, y:e.clientY};
});
['pointerup','pointercancel'].forEach(t => canvas.addEventListener(t, () => drag = null));
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.r = Math.min(14, Math.max(4, cam.r * Math.exp(e.deltaY*.0015))); }, {passive:false});
canvas.addEventListener('keydown', e => {
  const k = {ArrowLeft:[.12,0], ArrowRight:[-.12,0], ArrowUp:[0,.1], ArrowDown:[0,-.1]}[e.key];
  if (!k) return; e.preventDefault();
  cam.theta += k[0]; cam.phi = Math.min(Math.PI-.12, Math.max(.12, cam.phi + k[1]));
});

// HTML labels projected from 3D
const labelEls = {};
function label(key, html, cls){
  if (!labelEls[key]){ const el = document.createElement('span'); el.className = 'lab ' + cls; labelEls[key] = el; labelsEl.appendChild(el); }
  const el = labelEls[key]; if (el._html !== html){ el.innerHTML = html; el._html = html; } return el;
}
const tmpV = V(0,0,0);
function putLabel(el, world, dx, dy, show){
  if (!show){ el.style.display = 'none'; return; }
  tmpV.copy(world).project(camera);
  if (tmpV.z > 1){ el.style.display = 'none'; return; }
  el.style.display = '';
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  el.style.transform = `translate(${(tmpV.x+1)/2*w + dx}px, ${(1-tmpV.y)/2*h + dy}px) translate(-50%,-50%)`;
}

function resize(){
  if (!renderer) return;
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.fov = w/h < .9 ? 48 : 36;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stageEl);

const ELEM_LABELS = [
  ['C2z', '<i>C</i><sub>2</sub>(<i>z</i>)', V(0,0,3.15), 22, 0, 'elem'],
  ['C2y', '<i>C</i><sub>2</sub>(<i>y</i>)', V(0,2.4,0), 0, 18, 'elem'],
  ['C2x', '<i>C</i><sub>2</sub>(<i>x</i>)', V(2.4,0,0), 0, 18, 'elem'],
  ['i',   '<i>i</i>',                       V(0,0,0), 34, -20, 'elem'],
  ['sxy', 'σ(<i>xy</i>)',                    V(1.8,1.8,0), 0, 0, 'elem sxy'],
  ['sxz', 'σ(<i>xz</i>)',                    V(1.7,0,2.5), 0, 0, 'elem sxz'],
  ['syz', 'σ(<i>yz</i>)',                    V(0,1.7,2.5), 0, 0, 'elem syz'],
];
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last)/1000); last = now;
  let M = null, activeOp = null;
  if (S.anim){
    activeOp = S.anim.op;
    const t = Math.min(1, (now - S.anim.t0)/S.anim.dur);
    M = t >= 1 ? exactMatrix(activeOp) : opMatrix(activeOp, ease(t));
    if (t >= 1) finishOp();
  } else if (S.hold){ activeOp = S.hold.op; M = exactMatrix(activeOp); }
  live.matrix.copy(M || new THREE.Matrix4()); live.matrixWorldNeedsUpdate = true;
  ghost.visible = !!activeOp;

  const field = S.arrows === 'field' ? FIELDS[S.fieldId] : null, fv = field && fieldVecs(field);
  const osc = field && !activeOp;
  if (osc && S.playing) S.phase += dt * Math.PI * 2 * .55;
  const amp = osc ? .3 * Math.sin(S.phase) : 0;
  const cur = ATOMS.map((at,i) => field ? at.pos.clone().addScaledVector(fv[i], amp) : at.pos.clone());
  cur.forEach((p,i) => { atomMeshes[i].position.copy(p); ghostMeshes[i].position.copy(ATOMS[i].pos); });
  bonds.forEach((b,k) => placeBond(b, cur[0], cur[k+1]));

  const specs = arrowSpecs();
  specs.forEach((s,k) => {
    const a = poolArrow(livePool, live, k, false); a.userData.mat.color.setHex(s.color); placeArrow(a, cur[s.atom], s.vec);
    const g = poolArrow(ghostPool, ghost, k, true); g.userData.mat.color.setHex(s.color); placeArrow(g, ATOMS[s.atom].pos, s.vec);
  });
  for (let k = specs.length; k < livePool.length; k++){ livePool[k].visible = false; ghostPool[k].visible = false; }

  const resp = S.step === SPEC_STEP && field && !activeOp ? response(S.fieldId, S.part) : null;
  dipArrow.visible = !!(resp && resp.ir); ellip.visible = !!resp;
  if (resp){
    const s = Math.sin(S.phase);   // in step with the atoms
    if (resp.ir) placeArrow(dipArrow, V(0,0,0), resp.dmu.clone().normalize().multiplyScalar(1.5*s));
    const k = 4.2/(resp.A0[0][0] + resp.A0[1][1] + resp.A0[2][2]), gain = resp.raman ? .35*resp.n0/resp.nd*s : 0;
    const A = resp.A0.map((row,a)=> row.map((x,c)=> k*(x + gain*resp.dA[a][c])));
    ellip.matrix.set(A[0][0],A[0][1],A[0][2],0, A[1][0],A[1][1],A[1][2],0, A[2][0],A[2][1],A[2][2],0, 0,0,0,1); ellip.matrixWorldNeedsUpdate = true;
  }

  axesGroup.visible = S.axes;
  const hotId = activeOp && activeOp.kind !== 'E' ? activeOp.elem : null;
  Object.keys(ELEM).forEach(id => ELEM[id].set(S.elements || hotId === id, hotId === id));

  if (renderer){ placeCamera(); renderer.render(scene, camera); }

  // labels
  const lm = live.matrix;
  ATOMS.forEach((at,i) => putLabel(label('a'+i, at.html, 'atom'), cur[i].clone().applyMatrix4(lm), 18, -18, S.labels));
  [['x',V(2.75,0,0)],['y',V(0,2.75,0)],['z',V(0,0,2.75)]].forEach(([n,p]) => putLabel(label('ax'+n, n, 'axis'), p, 0, 0, S.axes && S.labels));
  ELEM_LABELS.forEach(([id, html, p, dx, dy, cls]) => putLabel(label('e'+id, html, cls), p, dx, dy, S.labels && (S.elements || hotId === id)));
}

const STEPS = [
  {short:'Count motions', enter(){ setArrows('none'); S.elements = false; }, html(){ return `

    <p>Describing where every atom of an <i>N</i>-atom molecule is takes 3<i>N</i> coordinates: an <i>x</i>, <i>y</i> and <i>z</i> for each atom. CO<sub>2</sub> has <i>N</i> = 3, so it has <strong>9 degrees of freedom</strong>, the same as water.</p>

    <p>The standard workaround is to do the bookkeeping in a smaller group that sits inside D<sub>∞h</sub>, then translate the answer back at the end. This lesson uses <strong>D<sub>2h</sub></strong>. All eight of its operations are symmetry operations of CO<sub>2</sub>, its character table contains only ±1, and each D<sub>∞h</sub> species turns into a unique combination of D<sub>2h</sub> species.</p>

  {short:'IR & Raman', enter(){ setArrows('field', isMode(S.fieldId) ? S.fieldId : MODES[0]); S.elements = false; }, html(){ return selectionStep(); }},

const SPEC_STEP = STEPS.length - 1;

/* ---------- step 8: selection rules ---------- */
const SPEC_NOTE = `CO<sub>2</sub> has a centre of inversion, so mutual exclusion applies. The symmetric stretch ν<sub>1</sub> is <i>g</i>: the two C=O bond dipoles grow together and cancel, so μ stays zero (the pink arrow never appears), but both bonds lengthen at once, so the polarizability breathes. It shows up only in the Raman spectrum. The antisymmetric stretch and the bend are <i>u</i>: they change μ, while the polarizability changes of the two bonds cancel. They show up only in the IR. Those two IR bands, at 667 cm<sup>−1</sup> (15 μm) and 2349 cm<sup>−1</sup>, are what make CO<sub>2</sub> a greenhouse gas.`;
function spectrumSVG(){
  const W = 600, PH = 62, GAP = 30, TOP = 20, X = wn => 34 + (4000 - wn)/3600*(W - 54);
  const panels = [['Infrared', 'ir', irActive], ['Raman', 'ra', ramanActive]];
  let svg = '';
  panels.forEach(([name, cls, test], p) => {
    const y0 = TOP + p*(PH + GAP), base = y0 + PH;
    svg += `<text class="pl" x="0" y="${y0 - 6}">${name}</text><line class="base" x1="34" x2="${W - 20}" y1="${base}" y2="${base}"/>`;
    const bands = MODES.flatMap(id => { const ir = speciesOf(id); return test(ir) ? FIELDS[id].bands.map(wn => ({id, ir, wn})) : []; }).sort((a,b) => b.wn - a.wn);
    let lastX = -99;
    bands.forEach(b => {
      const x = X(b.wn), lab = x - lastX > 36; if (lab) lastX = x;   // label only where it won't collide; the tooltip carries the rest
      svg += `<g data-tip="${FIELDS[b.id].html} ${FIELDS[b.id].name} · ${b.ir.html} · ${b.wn} cm<sup>−1</sup>"><line class="stick ${cls}" x1="${x}" x2="${x}" y1="${base}" y2="${y0 + 16}"/><circle class="${cls}" cx="${x}" cy="${y0 + 16}" r="4"/>${lab ? `<text class="lb" x="${x}" y="${y0 + 6}" text-anchor="middle">${b.wn}</text>` : ''}<rect class="hit" x="${x - 8}" y="${y0}" width="16" height="${PH}"/></g>`;
    });
    if (!bands.length) svg += `<text class="lb" x="${W/2}" y="${y0 + PH/2}" text-anchor="middle">no fundamentals</text>`;
  });
  const ay = TOP + 2*PH + GAP + 16;
  for (let t = 4000; t >= 500; t -= 500) svg += `<text class="ax" x="${X(t)}" y="${ay}" text-anchor="middle">${t}</text>`;
  svg += `<text class="ax" x="${(W + 14)/2}" y="${ay + 18}" text-anchor="middle">wavenumber / cm⁻¹</text>`;
  return `<div class="spec"><svg viewBox="0 0 ${W} ${ay + 24}" role="img" aria-label="Predicted infrared and Raman stick spectra">${svg}</svg><div class="tip" id="tip"></div></div>`;
}
function selectionStep(){
  const species = vibSpecies().map(ir => ({ir, modes:MODES.filter(id => speciesOf(id) === ir)}));
  const c = S.check8, done = S.reveal8 || (c && Object.values(c).every(Boolean));
  const yn = (s, key) => {
    const v = (S.sel[s.ir.id] || {})[key], st = c ? (c[s.ir.id + key] ? 'ok' : 'no') : '';
    return `<span class="yn ${st}" role="group" aria-label="${key === 'ir' ? 'IR' : 'Raman'} active for ${s.ir.id}"><button data-yn="${s.ir.id}|${key}|1" aria-pressed="${v === true}">Yes</button><button data-yn="${s.ir.id}|${key}|0" aria-pressed="${v === false}">No</button></span>`;
  };
  const why = ir => done ? `<td class="fn">${irActive(ir) ? `IR: like ${ir.lin.join(', ')}` : 'IR: no <i>x</i>, <i>y</i>, <i>z</i>'}; ${ramanActive(ir) ? `Raman: like ${ir.quad}` : 'Raman: no quadratic'}</td>` : '';
  const rows = species.map(s => `<tr><th>${chip(s.ir)} <span class="muted">${s.modes.map(id => FIELDS[id].html).join(', ')}</span></th><td>${yn(s,'ir')}</td><td>${yn(s,'ra')}</td>${why(s.ir)}</tr>`).join('');
  const count = test => MODES.filter(id => test(speciesOf(id))).length;
  const silent = MODES.filter(id => { const ir = speciesOf(id); return !irActive(ir) && !ramanActive(ir); });
  return `
    <p class="eyebrow">Step ${SPEC_STEP + 1} of ${STEPS.length}</p>
    <h2>Which vibrations show up in IR and Raman spectra?</h2>
    <p>Light can only excite a vibration if the vibration changes something the light's oscillating electric field can push on. The two common kinds of vibrational spectroscopy push on different things:</p>
    <ul>
      <li><strong>Infrared absorption</strong> needs the vibration to change the <strong>dipole moment</strong> μ. The dipole is a vector, and its components μ<sub><i>x</i></sub>, μ<sub><i>y</i></sub>, μ<sub><i>z</i></sub> transform like <i>x</i>, <i>y</i> and <i>z</i>.</li>
      <li><strong>Raman scattering</strong> needs the vibration to change the <strong>polarizability</strong> α, how easily the electron cloud is distorted. α is a 3 × 3 tensor, and its components α<sub><i>xx</i></sub>, α<sub><i>xy</i></sub>, … transform like the quadratic functions <i>x</i><sup>2</sup>, <i>xy</i>, ….</li>
    </ul>
    <h3>Watch it happen</h3>
    <p>Pick a mode. The <strong>pink arrow</strong> is the change in dipole, Δμ, worked out from partial charges on the atoms. The <strong>translucent shape</strong> is the polarizability ellipsoid, from a simple model in which each bond is easier to polarize along its length. If the arrow never appears, the mode cannot absorb IR. If the ellipsoid holds still, the mode cannot Raman scatter.</p>
    <div class="btnrow">${MODES.map(id => `<button class="btn ${S.fieldId===id?'active':''}" data-field="${id}">${FIELDS[id].html} ${FIELDS[id].name}</button>`).join('')}</div>
    <p class="hint">These are toy models, but they respect the molecule's symmetry, so they always agree with the group theory below. For the bend, try both partners.</p>
    <h3>The group theory shortcut</h3>
    <p>The strength of a transition from the ground state to the first excited level of a mode depends on the integral ⟨0|μ|1⟩. An integral over all space is zero unless its integrand is totally symmetric. The ground state is totally symmetric, and the excited level has the symmetry of the mode, so the integral can only survive if the mode has the same symmetry as one of μ<sub><i>x</i></sub>, μ<sub><i>y</i></sub>, μ<sub><i>z</i></sub>. The same argument with α gives the Raman rule. In practice:</p>
    <ol>
      <li>Find each vibration's symmetry species. Use the D<sub>∞h</sub> labels from step ${SPEC_STEP}. The D<sub>2h</sub> labels would give the same answer, but the D<sub>∞h</sub> ones are the ones to quote.</li>
      <li>It is <strong>IR active</strong> if that row of the character table lists <i>x</i>, <i>y</i> or <i>z</i> (underlined in orange below).</li>
      <li>It is <strong>Raman active</strong> if that row lists a quadratic function such as <i>x</i><sup>2</sup>, <i>z</i><sup>2</sup> or <i>xy</i> (underlined in blue).</li>
      <li>A vibration that is neither is <strong>silent</strong>: it exists, but neither technique sees it directly.</li>
    </ol>
    ${dinfTable(true)}
    <h3>Your turn</h3>
    <p>For each symmetry species in ${GV} = ${dinfVibHTML()}, decide whether it is IR active and whether it is Raman active.</p>
    <div class="tablewrap"><table><thead><tr><th>Species</th><th>IR active?</th><th>Raman active?</th>${done ? '<th></th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="btnrow"><button class="btn primary" data-action="check8">Check</button><button class="btn" data-action="reveal8">Show answer</button></div>
    ${c && !done ? `<p class="fb no">Not quite. Look along each species' row: is there an <i>x</i>, <i>y</i> or <i>z</i>? Is there a quadratic function?</p>` : ''}
    ${done ? `${c && !S.reveal8 ? '<p class="fb ok">Correct.</p>' : ''}
      <h3>The predicted spectra</h3>
      <p>Each IR- or Raman-active fundamental gives one band. A degenerate pair gives a single band, because both partners have the same frequency. Prediction: <strong>${count(irActive)}</strong> IR band${count(irActive) === 1 ? '' : 's'} and <strong>${count(ramanActive)}</strong> Raman band${count(ramanActive) === 1 ? '' : 's'}${silent.length ? `, with ${silent.map(id => FIELDS[id].html).join(', ')} silent` : ''}. In the real Raman spectrum, Fermi resonance splits that one band into two.</p>
      ${spectrumSVG()}
      <p class="hint">Stick heights are not intensities: group theory says whether a band can appear, not how strong it is. Hover a stick for details. Real spectra also show weaker overtone and combination bands.</p>
      <h3>Centres of inversion and mutual exclusion</h3>
      <p>If a molecule has a centre of inversion, <i>x</i>, <i>y</i> and <i>z</i> all change sign under <i>i</i> (they are <i>u</i>), and every quadratic function keeps its sign (<i>g</i>). So a <i>u</i> vibration can only be IR active and a <i>g</i> vibration can only be Raman active. No vibration can be both: this is the <strong>rule of mutual exclusion</strong>.</p>
      <p>${SPEC_NOTE}</p>` : ''}`;
}

function renderStepper(){
  $('stepper').innerHTML = STEPS.map((s,i) => `<li><button data-step="${i}" ${i===S.step?'aria-current="step"':''} class="${i<S.step?'done':''}"><span class="n">${i+1}</span>${s.short.replace('Γ3N', G3N).replace('D∞h', 'D<sub>∞h</sub>')}</button></li>`).join('');
}
function renderLesson(){
  $('body').innerHTML = STEPS[S.step].html();
  $('prev').disabled = S.step === 0; $('next').disabled = S.step === STEPS.length - 1;
  $('next').style.visibility = S.step === STEPS.length - 1 ? 'hidden' : '';
}
function goStep(i, scroll){
  S.step = Math.max(0, Math.min(STEPS.length-1, i));
  STEPS[S.step].enter(); syncToggles(); renderStepper(); renderLesson();
  if (scroll) $('lesson').scrollIntoView({block:'start', behavior: reduced ? 'auto' : 'smooth'});
}
$('stepper').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) goStep(+b.dataset.step, true); });
$('prev').onclick = () => goStep(S.step - 1, true);
$('next').onclick = () => goStep(S.step + 1, true);

$('body').addEventListener('input', e => { if (e.target.id){ S.inputs[e.target.id] = e.target.value; e.target.classList.remove('ok','no'); } });
$('body').addEventListener('click', e => {
  const opB = e.target.closest('[data-op]'); if (opB){ applyOp(opB.dataset.op); return; }
  const fB = e.target.closest('[data-field]');
  if (fB){ const id = fB.dataset.field; S.motionSeen[id] = true; setArrows('field', id); renderLesson(); return; }
  const ynB = e.target.closest('[data-yn]');
  if (ynB){ const [ir, key, v] = ynB.dataset.yn.split('|'); (S.sel[ir] ||= {})[key] = v === '1'; S.check8 = null; renderLesson(); return; }
  const a = e.target.closest('[data-action]'); if (!a) return;
  const g = gamma3N(), n = reduce(g), vib = vibSpecies();
  switch (a.dataset.action){
    case 'check8': S.check8 = {}; vib.forEach(ir => { const s = S.sel[ir.id] || {}; S.check8[ir.id+'ir'] = s.ir === irActive(ir); S.check8[ir.id+'ra'] = s.ra === ramanActive(ir); }); break;
    case 'reveal8': vib.forEach(ir => S.sel[ir.id] = {ir:irActive(ir), ra:ramanActive(ir)}); S.reveal8 = true; S.check8 = null; break;
    case 'check4': S.check4 = CLASSES.map((c,k) => parseNum(S.inputs['g3n-'+c.id]) === g[k]); break;
    case 'reveal4': CLASSES.forEach((c,k) => S.inputs['g3n-'+c.id] = fmt(g[k])); S.check4 = CLASSES.map(() => true); break;
    case 'check5': S.check5 = IRREPS.map((ir,k) => parseNum(S.inputs['n-'+ir.id]) === n[k]); break;
    case 'work5': S.showWork = !S.showWork; break;
    case 'vib': S.vibRevealed = true; break;
    case 'corr': S.corrRevealed = true; break;
  }
  renderLesson();
});
// spectrum tooltips
$('body').addEventListener('pointermove', e => {
  const tip = $('tip'); if (!tip) return;
  const t = e.target.closest('[data-tip]');
  if (!t){ tip.style.display = 'none'; return; }
  const box = tip.parentElement.getBoundingClientRect(), r = t.getBoundingClientRect();
  tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
  tip.style.left = (r.left + r.width/2 - box.left) + 'px'; tip.style.top = (r.top - box.top) + 'px';
});

buildModel();
goStep(0, false);
resize(); requestAnimationFrame(frame);
})();
</script>
</body>
