<script>window.THREE || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
<script>
// Planar biphenyl. Mulliken's convention for a planar D2h molecule: x is perpendicular to the molecular plane and
// z is the long axis through C1, C4, C1′ and C4′, so the molecule lies in the yz plane.
// r(C–C) ring = 1.397 Å, r(C1–C1′) = 1.49 Å, r(C–H) = 1.084 Å.
(function(){
const rC = 1.397, d = 1.49, rH = 1.084, s60 = Math.sqrt(3)/2;
const sq = v => `<i>${v}</i><sup>2</sup>`;
const D = (x,y,z) => [[x,0,0],[0,y,0],[0,0,z]];
window.LESSON = {
  id:'biphenyl', nameText:'biphenyl', formulaHTML:'Biphenyl, C<sub>12</sub>H<sub>10</sub>,', groupHTML:'D<sub>2h</sub>',
  scale:0.8, cam:{theta:0.55, phi:1.05, r:13}, hideHLabels:true,
  geometry(){
    const atoms = [], bonds = [];
    // ring around centre zc: angle 0 points back at the other ring
    const ring = (sgn, p) => {
      const zc = sgn*(d/2 + rC), base = atoms.length;
      [0,1,2,3,4,5].forEach(k => { const a = k*Math.PI/3; atoms.push({el:'C', html:`C<sub>${k+1}</sub>${p}`, pos:[0, rC*Math.sin(a), zc - sgn*rC*Math.cos(a)]}); });
      [1,2,3,4,5].forEach(k => { const a = k*Math.PI/3; atoms.push({el:'H', html:`H<sub>${k+1}</sub>${p}`, pos:[0, (rC+rH)*Math.sin(a), zc - sgn*(rC+rH)*Math.cos(a)]}); });
      [0,1,2,3,4,5].forEach(k => bonds.push({i:base+k, j:base+(k+1)%6, k:5.2, order:1.5, tag:'ring C–C stretch', torsTag:'ring pucker'}));
      [1,2,3,4,5].forEach(k => bonds.push({i:base+k, j:base+5+k, k:5.1}));
      return base;
    };
    const a = ring(1, ''), b = ring(-1, '′');
    bonds.push({i:a, j:b, k:4.6, tag:'inter-ring C–C stretch', tors:0.05, torsTag:'inter-ring twist'});
    return {atoms, bonds};
  },
  ff:{bend:1.05, bendH:0.47, oop:0.32, tors:0.14},
  skelTag:'ring deformation',
  charges:(at,i,A) => at.el === 'H' ? 0.1 : ([0,11].includes(i) ? 0 : -0.1),
  ops:[
    {id:'E',   cls:'E',   type:'E', html:'<i>E</i>', name:'Identity'},
    {id:'C2z', cls:'C2z', type:'C', axis:[0,0,1], n:2, html:'<i>C</i><sub>2</sub>(<i>z</i>)', name:'Rotation by 180° about the long axis'},
    {id:'C2y', cls:'C2y', type:'C', axis:[0,1,0], n:2, html:'<i>C</i><sub>2</sub>(<i>y</i>)', name:'Rotation by 180° about the in-plane short axis'},
    {id:'C2x', cls:'C2x', type:'C', axis:[1,0,0], n:2, html:'<i>C</i><sub>2</sub>(<i>x</i>)', name:'Rotation by 180° about the axis perpendicular to the plane'},
    {id:'i',   cls:'i',   type:'i', html:'<i>i</i>', name:'Inversion through the midpoint of C1–C1′'},
    {id:'sxy', cls:'sxy', type:'s', normal:[0,0,1], html:'σ(<i>xy</i>)', name:'Reflection through the plane that swaps the rings'},
    {id:'sxz', cls:'sxz', type:'s', normal:[0,1,0], html:'σ(<i>xz</i>)', name:'Reflection through the plane perpendicular to the molecule, along the long axis'},
    {id:'syz', cls:'syz', type:'s', normal:[1,0,0], html:'σ(<i>yz</i>)', name:'Reflection through the molecular plane'},
  ],
  classes:[
    {id:'E',   html:'<i>E</i>',                       desc:'Do nothing.'},
    {id:'C2z', html:'<i>C</i><sub>2</sub>(<i>z</i>)', desc:'Rotate 180° about the long axis through C<sub>1</sub>, C<sub>4</sub>, C<sub>1</sub>′ and C<sub>4</sub>′.'},
    {id:'C2y', html:'<i>C</i><sub>2</sub>(<i>y</i>)', desc:'Rotate 180° about the in-plane axis through the middle of the C<sub>1</sub>–C<sub>1</sub>′ bond. The rings swap.'},
    {id:'C2x', html:'<i>C</i><sub>2</sub>(<i>x</i>)', desc:'Rotate 180° about the axis perpendicular to the molecule through the middle of C<sub>1</sub>–C<sub>1</sub>′. The rings swap.'},
    {id:'i',   html:'<i>i</i>',                       desc:'Send every atom through the midpoint of C<sub>1</sub>–C<sub>1</sub>′ to the opposite side.'},
    {id:'sxy', html:'σ(<i>xy</i>)',                    desc:'Reflect through the plane perpendicular to the long axis, between the rings. The rings swap.'},
    {id:'sxz', html:'σ(<i>xz</i>)',                    desc:'Reflect through the plane perpendicular to the molecule that contains the long axis.'},
    {id:'syz', html:'σ(<i>yz</i>)',                    desc:'Reflect through the molecular plane.'},
  ],
  irreps:[
    {id:'Ag',  cls:'a1', html:'A<sub>g</sub>',  chi:[1, 1, 1, 1, 1, 1, 1, 1], quad:`${sq('x')}, ${sq('y')}, ${sq('z')}`},
    {id:'B1g', cls:'a2', html:'B<sub>1g</sub>', chi:[1, 1,-1,-1, 1, 1,-1,-1], rot:['R<sub><i>z</i></sub>'], quad:'<i>xy</i>'},
    {id:'B2g', cls:'b1', html:'B<sub>2g</sub>', chi:[1,-1, 1,-1, 1,-1, 1,-1], rot:['R<sub><i>y</i></sub>'], quad:'<i>xz</i>'},
    {id:'B3g', cls:'b2', html:'B<sub>3g</sub>', chi:[1,-1,-1, 1, 1,-1,-1, 1], rot:['R<sub><i>x</i></sub>'], quad:'<i>yz</i>'},
    {id:'Au',  cls:'a1', html:'A<sub>u</sub>',  chi:[1, 1, 1, 1,-1,-1,-1,-1]},
    {id:'B1u', cls:'a2', html:'B<sub>1u</sub>', chi:[1, 1,-1,-1,-1,-1, 1, 1], lin:['<i>z</i>']},
    {id:'B2u', cls:'b1', html:'B<sub>2u</sub>', chi:[1,-1, 1,-1,-1, 1,-1, 1], lin:['<i>y</i>']},
    {id:'B3u', cls:'b2', html:'B<sub>3u</sub>', chi:[1,-1,-1, 1,-1, 1, 1,-1], lin:['<i>x</i>']},
  ],
  tr:['x','y','z'].map((a,k) => ({id:'T'+a, parts:[[0,1,2].map(j => +(j === k))]})).concat(['x','y','z'].map((a,k) => ({id:'R'+a, R:true, parts:[[0,1,2].map(j => +(j === k))]}))),
  molPlaneClass:'syz',
  matOps:['C2z','i','syz'],
  text:{
    group:`<p>Biphenyl is two benzene rings joined by a single C–C bond. If the two rings lie in one plane, the molecule has three perpendicular twofold axes, three mirror planes and a centre of inversion at the middle of the central bond: the point group <strong>D<sub>2h</sub></strong>, with 8 operations, each in a class of its own, <i>h</i> = 8.</p>
      <p>Is biphenyl really flat? Not in the gas phase: the hydrogens next to the central bond (H<sub>2</sub>, H<sub>6</sub>, H<sub>2</sub>′, H<sub>6</sub>′) bump into each other, and the rings twist about 44° apart. That conformer keeps only the three <i>C</i><sub>2</sub> axes and belongs to <strong>D<sub>2</sub></strong>. Twist all the way to 90° and it becomes <strong>D<sub>2d</sub></strong>, like allene. In the crystal at room temperature biphenyl is planar on average, and that is the D<sub>2h</sub> form this lesson treats.</p>
      <p>Axes follow Mulliken's convention for planar D<sub>2h</sub> molecules: <i>x</i> is perpendicular to the molecular plane and <i>z</i> is the long axis, which passes through the most atoms. Other choices permute the labels B<sub>1</sub>, B<sub>2</sub> and B<sub>3</sub>.</p>`,
    opsHint:`<p class="hint">σ(<i>yz</i>), the molecular plane, leaves all 22 atoms in place. The long-axis operations, <i>C</i><sub>2</sub>(<i>z</i>) and σ(<i>xz</i>), leave the six atoms on that axis. Everything that swaps the two rings moves every atom.</p>`,
    vecNote:`<p class="muted">Every D<sub>2h</sub> operation turns a vector by 0° or 180°, so all the contributions here are +1, −1 or 0, just as in CO<sub>2</sub>.</p>`,
    contribNote:`D<sub>2h</sub> needs only <i>E</i> = 3, <i>C</i><sub>2</sub> = −1, <i>i</i> = −3 and σ = 1.`,
    vibNote:`<p class="muted">D<sub>2h</sub> species are all one-dimensional, so nothing in biphenyl is degenerate: 60 vibrations, 60 frequencies (though many C–H stretches lie within a few wavenumbers of each other). In-plane vibrations are the species with χ = +1 under σ(<i>yz</i>): A<sub>g</sub>, B<sub>3g</sub>, B<sub>1u</sub> and B<sub>2u</sub>.</p>`,
    modesHint:`<i>i</i> sorts <i>g</i> from <i>u</i>, and σ(<i>yz</i>) tells in-plane from out-of-plane motion.`,
    irNote:`<p>Only the <i>u</i> species with <i>x</i>, <i>y</i> or <i>z</i> absorb: B<sub>1u</sub> (dipole change along the long axis), B<sub>2u</sub> (in-plane, across the molecule) and B<sub>3u</sub> (out of the plane).</p>`,
    ramanNote:`<p>Planar biphenyl has a centre of inversion, so no vibration appears in both spectra, and the A<sub>u</sub> vibrations, including the twist of one ring against the other about the central bond, are silent.</p>
      <p>In twisted D<sub>2</sub> biphenyl the <i>g</i>/<i>u</i> pairs merge (A<sub>g</sub> and A<sub>u</sub> both become A, B<sub>1g</sub> and B<sub>1u</sub> become B<sub>1</sub>, and so on), and in D<sub>2</sub> every B species carries both a linear and a quadratic function. Bands that coincide in the IR and Raman spectra are therefore evidence that the rings are not coplanar.</p>`,
  },
};
})();
</script>
<script src="assets/lesson.js"></script>
